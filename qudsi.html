:root{
  --bg:#EFE6D4; --card:#F6EDDB; --text:#3A352E; --text-2:rgba(58,53,46,.62); --text-3:rgba(58,53,46,.34);
  --sep:rgba(58,53,46,.16); --line:rgba(58,53,46,.09); --fill:rgba(120,105,80,.12);
  --accent:#0B5742; --accent-2:#08463A; --accent-bg:rgba(11,87,66,.10); --gold:#A8741A; --gold-bg:rgba(168,116,26,.12);
  --ink:#063D30; --qtext:#0A5441;
  --shadow:0 1px 2px rgba(58,53,46,.05), 0 4px 14px rgba(58,53,46,.06);
}
:root[data-bg="white"]{ --bg:#F2F2F7; --card:#FAFAF8; --text:#2B2B2B; --text-2:rgba(43,43,43,.6); --text-3:rgba(43,43,43,.32); --sep:rgba(43,43,43,.16); --line:rgba(43,43,43,.08); --fill:rgba(120,120,128,.1); }
:root[data-bg="dark"]{ --bg:#121212; --card:#1E1E1E; --text:#E6E1D6; --text-2:rgba(230,225,214,.62); --text-3:rgba(230,225,214,.32); --sep:rgba(230,225,214,.14); --line:rgba(255,255,255,.07); --fill:rgba(200,200,200,.08);
  --accent:#34C77B; --accent-2:#2BAA68; --accent-bg:rgba(52,199,123,.16); --gold:#E3B25A; --gold-bg:rgba(227,178,90,.14); --ink:#CDEFE0; --qtext:#4CC79B;
  --shadow:0 1px 3px rgba(0,0,0,.45), 0 5px 16px rgba(0,0,0,.35); }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--text); font-family:'PlexAr',system-ui,sans-serif; line-height:1.85; -webkit-font-smoothing:antialiased; padding-bottom:calc(36px + env(safe-area-inset-bottom,0px));}
a{color:var(--accent);}
.hero{position:relative; overflow:hidden; color:#fff; padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 26px; background:linear-gradient(160deg,#0E6B52 0%,#0A5441 48%,#063D30 100%);}
.hero::before{content:''; position:absolute; inset-inline-end:0; top:-30px; width:300px; height:300px; background:url(icons/drawer-zellige.png) no-repeat center/contain; pointer-events:none;}
[dir=rtl] .hero::before{transform:scaleX(-1);}
.hero::after{content:''; position:absolute; inset-inline:0; bottom:0; height:2px; background:linear-gradient(90deg,transparent,#D9B15C 30%,#D9B15C 70%,transparent);}
.hero-top{position:relative; display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:18px;}
.playlogo{vertical-align:-2px; margin-inline-start:5px; flex:0 0 auto;}
.back{display:inline-flex; align-items:center; gap:6px; flex:0 0 auto; white-space:nowrap; color:#fff; text-decoration:none; font-weight:600; font-size:13.5px; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,.12);}
.back svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
[dir=ltr] .back svg{transform:scaleX(-1);}
.langs{display:flex; gap:4px; background:rgba(255,255,255,.12); padding:3px; border-radius:999px; direction:ltr;}
.langs button{border:0; background:transparent; color:#fff; font:inherit; font-size:12.5px; font-weight:600; padding:5px 9px; border-radius:999px; cursor:pointer;}
.langs button.on{background:#fff; color:#063D30;}
.hero h1{position:relative; margin:0 0 6px; font-size:clamp(26px,7.4vw,34px); line-height:1.35; font-weight:800; color:#fff;}
.hero p{position:relative; margin:0; font-size:14.5px; color:rgba(255,255,255,.86); font-weight:500; max-width:34em;}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
main{max-width:720px; margin:0 auto; padding:14px max(10px,env(safe-area-inset-left)) 0;}
.prog{display:flex; align-items:center; flex-wrap:wrap; gap:10px 14px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px 16px; box-shadow:var(--shadow); margin-bottom:12px;}
.prog .big{font-size:30px; font-weight:800; color:var(--accent); line-height:1;} .prog .big small{font-size:14px; color:var(--text-2); font-weight:600;}
.prog .tx{font-size:13.5px; color:var(--text-2); line-height:1.5;} .prog .tx b{display:block; font-size:15px; color:var(--ink);}
.dots{display:flex; flex-wrap:wrap; gap:6px; flex:1 1 100%;} .dots i{width:14px; height:14px; border-radius:50%; background:var(--fill); border:1.5px solid var(--sep);} .dots i.on{background:var(--accent); border-color:var(--accent);}
.door{background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); margin:0 0 10px; overflow:hidden;}
.door>button{all:unset; box-sizing:border-box; width:100%; display:flex; align-items:center; gap:12px; padding:14px 14px; cursor:pointer;}
.door .ic{flex:0 0 46px; height:46px; border-radius:15px; background:var(--accent-bg); color:var(--accent); display:flex; align-items:center; justify-content:center;}
.door .ic svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
.door .hd{flex:1; min-width:0;} .door .hd b{display:block; font-size:17px; color:var(--ink); line-height:1.4; font-weight:800;} .door .hd span{display:block; font-size:13px; color:var(--text-2); line-height:1.55; margin-top:2px;}
.door .tk{flex:0 0 auto; width:26px; height:26px; border-radius:50%; border:2px solid var(--sep); display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; font-weight:800;}
.door.done .tk{background:var(--accent); border-color:var(--accent);}
.door .chev{flex:0 0 auto; width:18px; height:18px; fill:none; stroke:var(--text-3); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; transition:transform .2s;}
.door.open .chev{transform:rotate(90deg);}
.door .body{display:none; padding:0 14px 16px; border-top:1px solid var(--line);} .door.open .body{display:block;}
.sec{margin:14px 0 4px; font-size:13.5px; font-weight:800; color:var(--gold); letter-spacing:.2px;}
.q{font-family:'AmiriQuran','Amiri',serif; font-size:clamp(25px,6.8vw,29px); line-height:2.4; color:var(--qtext); text-align:center; direction:rtl; margin:0; word-spacing:2px; -webkit-text-stroke:.014em currentColor;}
.ref{display:block; text-align:center; font-size:12.5px; color:var(--text-3); font-weight:600; direction:rtl;}
.ex{padding:6px 12px 10px; border-radius:16px; background:var(--fill); border:1px solid var(--line);}
.h{margin:8px 0; padding:10px 12px; border-radius:16px; background:var(--fill); border:1px solid var(--line); border-inline-start:4px solid var(--accent);}
.ht{margin:0; font-size:17px; line-height:2.1; color:var(--ink); direction:rtl; text-align:start; font-weight:500;}
[dir=ltr] .ht{text-align:right;}
.hs{margin:6px 0 0; font-size:12.5px; color:var(--text-3); line-height:1.7; font-weight:600;}
.hm{margin:8px 0 0; padding:8px 10px; font-size:14px; line-height:1.85; color:var(--text-2); background:var(--gold-bg); border-radius:12px;}
.hm b{color:var(--gold);}
.stp{margin:4px 0 2px; padding-inline-start:22px;} .stp li{margin:6px 0; font-size:15px; color:var(--ink);}
.note{margin:6px 0 0; font-size:12.5px; color:var(--text-3);}
.act{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px;}
.act button{border:0; font:inherit; font-size:15px; font-weight:800; padding:11px 20px; border-radius:999px; cursor:pointer; min-height:44px; background:var(--accent); color:#fff;}
.act button.undo{background:var(--fill); color:var(--text-2);}
.act span{font-size:13px; color:var(--text-2);}
.qrf{margin:14px 14px 0; text-align:center; color:var(--text-3); font-size:12.5px;} .qrf .qrb{display:block; margin:10px auto 0; width:92px;} .qrf .qrb svg{display:block; width:92px; height:92px; border-radius:10px; border:1px solid var(--sep);}
.foot{margin:22px 14px 0; text-align:center; color:var(--text-3); font-size:12.5px; line-height:1.8;}
.srch{display:block; width:100%; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; font-size:15px; padding:12px 16px; border-radius:16px; box-shadow:var(--shadow); margin:0 0 10px;}
.srch::placeholder{color:var(--text-3);}
.pills{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; scrollbar-width:none;} .pills::-webkit-scrollbar{display:none;}
.pills button{flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--text-2); font:inherit; font-size:13.5px; font-weight:700; padding:8px 14px; border-radius:999px; cursor:pointer; min-height:38px;}
.pills button.on{background:var(--accent); border-color:var(--accent); color:#fff;}
.cnt{margin:0 4px 8px; font-size:12.5px; color:var(--text-3); font-weight:600;}
.card{background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); margin:0 0 10px; padding:14px 14px 12px;}
.card .tg{display:inline-block; font-size:12px; font-weight:800; color:var(--gold); background:var(--gold-bg); padding:2px 10px; border-radius:999px;}
.card h2{margin:8px 0 2px; font-size:17px; color:var(--ink); font-weight:800; line-height:1.5;}
.card .ht{margin:6px 0 0; padding:10px 12px; border-radius:16px; background:var(--fill); border:1px solid var(--line); border-inline-start:4px solid var(--accent); font-size:18px; line-height:2.15;}
.card .hs{margin:8px 0 0;}
.card .nt{margin:6px 0 0; font-size:13px; color:var(--text-2); line-height:1.8;}
.card .ac{display:flex; gap:8px; margin-top:10px;}
.card .ac button{border:0; font:inherit; font-size:13.5px; font-weight:700; padding:8px 16px; border-radius:999px; cursor:pointer; min-height:38px; background:var(--accent-bg); color:var(--accent);}
.empty{text-align:center; color:var(--text-2); padding:26px 10px;}
</style>

dith Qudsi", "copy": "Copy", "copied": "Copied ✓", "share": "Share", "none": "No results.", "foot": "A hadith qudsi is what the Prophet ﷺ narrates from his Lord. Only hadiths found in Sahih al-Bukhari and Sahih Muslim are included, copied verbatim in Arabic with no commentary or translation; the source gives the book and chapter name, without numbers. The short titles are only for finding your way.", "by": {"both": "Agreed upon (Bukhari and Muslim)", "bukhari": "Narrated by al-Bukhari", "muslim": "Narrated by Muslim"}, "narrator": "Narrator"}}, "cats": [{"id": "mercy", "t": {"ar": "رحمة الله ومغفرته", "fr": "Miséricorde et pardon", "en": "Mercy and forgiveness"}}, {"id": "near", "t": {"ar": "القرب من الله", "fr": "La proximité d’Allah", "en": "Closeness to Allah"}}, {"id": "worship", "t": {"ar": "العبادات", "fr": "Les adorations", "en": "Acts of worship"}}, {"id": "tawhid", "t": {"ar": "التوحيد", "fr": "Le tawhid", "en": "Tawhid"}}, {"id": "sabr", "t": {"ar": "الصبر والابتلاء", "fr": "Patience et épreuve", "en": "Patience and trials"}}, {"id": "rights", "t": {"ar": "حقوق العباد", "fr": "Les droits des gens", "en": "Rights of people"}}], "items": [{"c": "mercy", "t": {"ar": "حرّمتُ الظلم على نفسي", "fr": "Allah a interdit l’injustice", "en": "Allah has forbidden injustice"}, "v": "«يَا عِبَادِي إِنِّي حَرَّمْتُ الظُّلْمَ عَلَى نَفْسِي وَجَعَلْتُهُ بَيْنَكُمْ مُحَرَّمًا فَلاَ تَظَالَمُوا يَا عِبَادِي كُلُّكُمْ ضَالٌّ إِلاَّ مَنْ هَدَيْتُهُ فَاسْتَهْدُونِي أَهْدِكُمْ يَا عِبَادِي كُلُّكُمْ جَائِعٌ إِلاَّ مَنْ أَطْعَمْتُهُ فَاسْتَطْعِمُونِي أُطْعِمْكُمْ يَا عِبَادِي كُلُّكُمْ عَارٍ إِلاَّ مَنْ كَسَوْتُهُ فَاسْتَكْسُونِي أَكْسُكُمْ يَا عِبَادِي إِنَّكُمْ تُخْطِئُونَ بِاللَّيْلِ وَالنَّهَارِ وَأَنَا أَغْفِرُ الذُّنُوبَ جَمِيعًا فَاسْتَغْفِرُونِي أَغْفِرْ لَكُمْ يَا عِبَادِي إِنَّكُمْ لَنْ تَبْلُغُوا ضَرِّي فَتَضُرُّونِي وَلَنْ تَبْلُغُوا نَفْعِي فَتَنْفَعُونِي يَا عِبَادِي لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ كَانُوا عَلَى أَتْقَى قَلْبِ رَجُلٍ وَاحِدٍ مِنْكُمْ مَا زَادَ ذَلِكَ فِي مُلْكِي شَيْئًا يَا عِبَادِي لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ كَانُوا عَلَى أَفْجَرِ قَلْبِ رَجُلٍ وَاحِدٍ مَا نَقَصَ ذَلِكَ مِنْ مُلْكِي شَيْئًا يَا عِبَادِي لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ قَامُوا فِي صَعِيدٍ وَاحِدٍ فَسَأَلُونِي فَأَعْطَيْتُ كُلَّ إِنْسَانٍ مَسْأَلَتَهُ مَا نَقَصَ ذَلِكَ مِمَّا عِنْدِي إِلاَّ كَمَا يَنْقُصُ الْمِخْيَطُ إِذَا أُدْخِلَ الْبَحْرَ يَا عِبَادِي إِنَّمَا هِيَ أَعْمَالُكُمْ أُحْصِيهَا لَكُمْ ثُمَّ أُوَفِّيكُمْ إِيَّاهَا فَمَنْ وَجَدَ خَيْرًا فَلْيَحْمَدِ اللَّهَ وَمَنْ وَجَدَ غَيْرَ ذَلِكَ فَلاَ يَلُومَنَّ إِلاَّ نَفْسَهُ»", "s": "رواه مسلم (كتاب البر والصلة والآداب). عن أبي ذرٍّ رضي الله عنه، عن النبي ﷺ فيما يرويه عن ربّه.", "k": "muslim", "who": {"fr": "Abu Dharr", "en": "Abu Dharr"}}, {"c": "mercy", "t": {"ar": "من جاء بالحسنة فله عشر أمثالها", "fr": "La bonne action est multipliée", "en": "A good deed is multiplied"}, "v": "«مَنْ جَاءَ بِالْحَسَنَةِ فَلَهُ عَشْرُ أَمْثَالِهَا وَأَزِيدُ وَمَنْ جَاءَ بِالسَّيِّئَةِ فَجَزَاؤُهُ سَيِّئَةٌ مِثْلُهَا أَوْ أَغْفِرُ وَمَنْ تَقَرَّبَ مِنِّي شِبْرًا تَقَرَّبْتُ مِنْهُ ذِرَاعًا وَمَنْ تَقَرَّبَ مِنِّي ذِرَاعًا تَقَرَّبْتُ مِنْهُ بَاعًا وَمَنْ أَتَانِي يَمْشِي أَتَيْتُهُ هَرْوَلَةً وَمَنْ لَقِيَنِي بِقُرَابِ الأَرْضِ خَطِيئَةً لاَ يُشْرِكُ بِي شَيْئًا لَقِيتُهُ بِمِثْلِهَا مَغْفِرَةً»", "s": "رواه مسلم (كتاب الذكر والدعاء والتوبة والاستغفار). عن أبي ذرٍّ رضي الله عنه، عن النبي ﷺ فيما يرويه عن ربّه.", "k": "muslim", "who": {"fr": "Abu Dharr", "en": "Abu Dharr"}}, {"c": "mercy", "t": {"ar": "إذا همَّ عبدي بحسنة أو سيّئة", "fr": "Intention d’une bonne ou d’une mauvaise action", "en": "Intending a good or a bad deed"}, "v": "«إِذَا أَرَادَ عَبْدِي أَنْ يَعْمَلَ سَيِّئَةً فَلاَ تَكْتُبُوهَا عَلَيْهِ حَتَّى يَعْمَلَهَا، فَإِنْ عَمِلَهَا فَاكْتُبُوهَا بِمِثْلِهَا وَإِنْ تَرَكَهَا مِنْ أَجْلِي فَاكْتُبُوهَا لَهُ حَسَنَةً وَإِذَا أَرَادَ أَنْ يَعْمَلَ حَسَنَةً فَلَمْ يَعْمَلْهَا فَاكْتُبُوهَا لَهُ حَسَنَةً، فَإِنْ عَمِلَهَا فَاكْتُبُوهَا لَهُ بِعَشْرِ أَمْثَالِهَا إِلَى سَبْعِمِائَةٍ»", "s": "رواه البخاري (كتاب التوحيد). عن أبي هريرة رضي الله عنه، عن النبي ﷺ فيما يرويه عن ربّه.", "k": "bukhari", "who": {"fr": "Abu Hurayra", "en": "Abu Hurayrah"}}, {"c": "mercy", "t": {"ar": "أُحِلُّ عليكم رضواني", "fr": "Je vous accorde Mon agrément", "en": "I grant you My pleasure"}, "v": "«إِنَّ اللَّهَ يَقُولُ لأَهْلِ الْجَنَّةِ يَا أَهْلَ الْجَنَّةِ. يَقُولُونَ لَبَّيْكَ رَبَّنَا وَسَعْدَيْكَ. فَيَقُولُ هَلْ رَضِيتُمْ فَيَقُولُونَ وَمَا لَنَا لاَ نَرْضَى وَقَدْ أَعْطَيْتَنَا مَا لَمْ تُعْطِ أَحَدًا مِنْ خَلْقِكَ. فَيَقُولُ أَنَا أُعْطِيكُمْ أَفْضَلَ مِنْ ذَلِكَ. قَالُوا يَا رَبِّ وَأَىُّ شَىْءٍ أَفْضَلُ مِنْ ذَلِكَ فَيَقُولُ أُحِلُّ عَلَيْكُمْ رِضْوَانِي فَلاَ أَسْخَطُ عَلَيْكُمْ بَعْدَهُ أَبَدًا»", "s": "متّفقٌ عليه — البخاري (كتاب الرقاق · كتاب التوحيد) ، مسلم (كتاب الجنة وصفة نعيمها وأهلها). عن أبي سعيدٍ الخدريّ رضي الله عنه، عن النبي ﷺ فيما يرويه عن ربّه.", "k": "both", "who": {"fr": "Abu Sa‘id al-Khudri", "en": "Abu Sa‘id al-Khudri"}}, {"c": "mercy", "t": {"ar": "أعددتُ لعبادي الصالحين", "fr": "J’ai préparé pour Mes serviteurs vertueux", "en": "I have prepared for My righteous servants"}, "v": "«أَعْدَدْتُ لِعِبَادِيَ الصَّالِحِينَ مَا لاَ عَيْنٌ رَأَتْ وَلاَ أُذُنٌ سَمِعَتْ وَلاَ خَطَرَ عَلَى قَلْبِ بَشَرٍ»", "s": "رواه مسلم (كتاب الجنة وصفة نعيمها وأهلها). عن أبي هريرة رضي الله عنه، عن النبي ﷺ فيما يرويه عن ربّه.", "k": "muslim", "who": {"fr": "Abu Hurayra", "en": "Abu Hurayrah"}}, {"c": "near", "t": {"ar": "أنا عند ظنّ عبدي بي", "fr": "Je suis selon l’opinion que Mon serviteur a de Moi", "en": "I am as My servant thinks of Me"}, "v": "«أَنَا عِنْدَ ظَنِّ عَبْدِي بِي وَأَنَا مَعَهُ حِينَ يَذْكُرُنِي إِنْ ذَكَرَنِي فِي نَفْسِهِ ذَكَرْتُهُ فِي نَفْسِي وَإِنْ ذَكَرَنِي فِي مَلإٍ ذَكَرْتُهُ فِي مَلإٍ هُمْ خَيْرٌ مِنْهُمْ وَإِنْ تَقَرَّبَ مِنِّي شِبْرًا تَقَرَّبْتُ إِلَيْهِ ذِرَاعًا وَإِنْ تَقَرَّبَ إِلَىَّ ذِرَاعًا تَقَرَّبْتُ مِنْهُ بَاعًا وَإِنْ أَتَانِي يَمْشِي أَتَيْتُهُ هَرْوَلَةً»       '<div class="ac"><button type="button" data-cp="' + DATA.items.indexOf(h) + '">' + esc(L.copy) + '</button>' + (navigator.share ? '<button type="button" data-sh="' + DATA.items.indexOf(h) + '">' + esc(L.share) + '</button>' : '') + '</div></article>';
  }).join('') : '<p class="empty">' + esc(L.none) + '</p>';
  document.querySelectorAll('#pills button').forEach(function(b){ b.onclick = function(){ cat = b.dataset.c; render(); }; });
  document.querySelectorAll('[data-cp]').forEach(function(b){ b.onclick = function(){ var h = DATA.items[+b.dataset.cp]; var tx = h.v + '\n— ' + h.s; try{ navigator.clipboard.writeText(tx).then(function(){ b.textContent = L.copied; setTimeout(function(){ b.textContent = L.copy; }, 1500); }); }catch(e){} }; });
  document.querySelectorAll('[data-sh]').forEach(function(b){ b.onclick = function(){ var h = DATA.items[+b.dataset.sh]; try{ navigator.share({ text: h.v + '\n— ' + h.s }); }catch(e){} }; });
}
$('#q').addEventListener('input', function(e){ qv = e.target.value; render(); $('#q').focus(); });
document.querySelectorAll('.langs button').forEach(function(b){ b.onclick = function(){ lang = b.dataset.l; sset('az_qudsi_lang', lang); render(); }; });
render();
})();
</script>
</body>
</html>
