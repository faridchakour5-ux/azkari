name: Deploy to GitHub Pages

# مُعطَّل: النشرُ المعتمد على نتليفاي (salatee.org). وكان هذا يبني على كلّ
# رفعٍ فيُبقي نسخةً ثانيةً حيّةً على GitHub Pages قد تختلف عن المنشور.
# بقي التشغيلُ اليدويّ وحدَه، فالعودةُ إليه ممكنةٌ متى شئت.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: '.github'
          force_orphan: true
          enable_jekyll: false
