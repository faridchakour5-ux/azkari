name: Checks

# فحوصٌ سريعة لا تنشر شيئًا: الأرقام اللاتينيّة، نحوُ السكربتات، اختباراتُ الإشعارات، ودخانُ الواجهة.
on:
  push:
    branches: [claude/dreamy-tesla-jorpcc]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: أرقام لاتينيّة فقط
        run: python3 tools/check-digits.py
      - name: نحوُ السكربتات ولا دوالَّ مكرَّرة
        run: node tools/check-js.mjs
      - name: اختباراتُ الإشعارات
        run: |
          npm --prefix netlify/functions ci --no-audit --no-fund
          node tools/test-push.mjs
      - name: دخانُ الواجهة (ar/fr/en)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8123 >/dev/null 2>&1 &
          sleep 2
          node tools/smoke.mjs
