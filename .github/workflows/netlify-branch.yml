name: Feed Netlify branch

# هذه العُقدةُ هي شريانُ الموقع، لا مجرّدَ مزامنة.
#
#   فرعُ العمل  claude/dreamy-tesla-jorpcc      ← يُرفَع إليه
#         ↓   (هذه العُقدة)
#   الفرعُ الافتراضيّ  claude/loving-cerf-346jn7
#         ↓
#   نتليفاي يبني من هذا الفرع وحدَه  →  salatee.org
#
# كانت تُسمّى «sync-cloudflare»، وهو اسمٌ من عهدٍ سابق يُوهم أنّها لخدمةٍ
# أخرى — وحذفُها يُجمّد salatee.org على آخر نسخةٍ بُنيت، بلا خطأٍ ظاهرٍ
# يُنبّه. فسُمّيت باسمها الصحيح لئلّا يُخدَع بها أحد.
#
# فإن أردتَ الاستغناءَ عنها يومًا، فالطريقُ أن يُوجَّه نتليفاي إلى فرع
# العمل مباشرةً من لوحته (Build & deploy ← Branch to deploy)، ثمّ تُحذف.

on:
  push:
    branches:
      - claude/dreamy-tesla-jorpcc
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: netlify-branch
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/dreamy-tesla-jorpcc

      - name: Mirror work branch -> Netlify production branch
        run: git push --force origin HEAD:claude/loving-cerf-346jn7
