<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bg="sepia">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0A5441">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preload" href="fonts/amiri-quran.woff2" as="font" type="font/woff2" crossorigin>
<title>تعلّم التجويد — صلاتي</title>
<style>
@font-face{font-family:'PlexAr'; src:url('fonts/ui-400.woff2') format('woff2'); font-weight:400; font-display:swap;}
@font-face{font-family:'PlexAr'; src:url('fonts/ui-600.woff2') format('woff2'); font-weight:600; font-display:swap;}
@font-face{font-family:'PlexAr'; src:url('fonts/ui-700.woff2') format('woff2'); font-weight:700; font-display:swap;}
@font-face{font-family:'AmiriQuran'; src:url('fonts/amiri-quran.woff2') format('woff2'); font-display:swap;}
:root{
  --bg:#EFE6D4; --card:#F6EDDB; --text:#3A352E; --text-2:rgba(58,53,46,.62); --text-3:rgba(58,53,46,.34);
  --sep:rgba(58,53,46,.16); --line:rgba(58,53,46,.09); --fill:rgba(120,105,80,.12);
  --accent:#0B5742; --accent-2:#08463A; --accent-bg:rgba(11,87,66,.10); --gold:#A8741A; --gold-bg:rgba(168,116,26,.12);
  --ink:#063D30; --qtext:#0A5441;
  --shadow:0 1px 2px rgba(58,53,46,.05), 0 4px 14px rgba(58,53,46,.06);
}
:root[data-bg="white"]{ --bg:#F2F2F7; --card:#FAFAF8; --text:#2B2B2B; --text-2:rgba(43,43,43,.6); --text-3:rgba(43,43,43,.32); --sep:rgba(43,43,43,.16); --line:rgba(43,43,43,.08); --fill:rgba(120,120,128,.1); }
:root[data-bg="dark"]{ --bg:#121212; --card:#1E1E1E; --text:#E6E1D6; --text-2:rgba(230,225,214,.62); --text-3:rgba(230,225,214,.32); --sep:rgba(230,225,214,.14); --line:rgba(255,255,255,.07); --fill:rgba(200,200,200,.08);
  --accent:#34C77B; --accent-2:#2BAA68; --accent-bg:rgba(52,199,123,.16); --gold:#E3B25A; --gold-bg:rgba(227,178,90,.14); --ink:#CDEFE0; --qtext:#4CC79B;
  --shadow:0 1px 3px rgba(0,0,0,.45), 0 5px 16px rgba(0,0,0,.35); }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--text); font-family:'PlexAr',system-ui,sans-serif; line-height:1.85; -webkit-font-smoothing:antialiased; padding-bottom:calc(36px + env(safe-area-inset-bottom,0px));}
a{color:var(--accent);}
.hero{position:relative; overflow:hidden; color:#fff; padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 26px; background:linear-gradient(160deg,#0E6B52 0%,#0A5441 48%,#063D30 100%);}
.hero::before{content:''; position:absolute; inset-inline-end:0; top:-30px; width:300px; height:300px; background:url(icons/drawer-zellige.png) no-repeat center/contain; pointer-events:none;}
[dir=rtl] .hero::before{transform:scaleX(-1);}
.hero::after{content:''; position:absolute; inset-inline:0; bottom:0; height:2px; background:linear-gradient(90deg,transparent,#D9B15C 30%,#D9B15C 70%,transparent);}
.hero-top{position:relative; display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:18px;}
.playlogo{vertical-align:-2px; margin-inline-start:5px; flex:0 0 auto;}
.back{display:inline-flex; align-items:center; gap:6px; flex:0 0 auto; white-space:nowrap; color:#fff; text-decoration:none; font-weight:600; font-size:13.5px; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,.12);}
.back svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
[dir=ltr] .back svg{transform:scaleX(-1);}
.langs{display:flex; gap:4px; background:rgba(255,255,255,.12); padding:3px; border-radius:999px; direction:ltr;}
.langs button{border:0; background:transparent; color:#fff; font:inherit; font-size:12.5px; font-weight:600; padding:5px 9px; border-radius:999px; cursor:pointer;}
.langs button.on{background:#fff; color:#063D30;}
.hero h1{position:relative; margin:0 0 6px; font-size:clamp(26px,7.4vw,34px); line-height:1.35; font-weight:800; color:#fff;}
.hero p{position:relative; margin:0; font-size:14.5px; color:rgba(255,255,255,.86); font-weight:500; max-width:34em;}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
main{max-width:720px; margin:0 auto; padding:14px max(10px,env(safe-area-inset-left)) 0;}
.prog{display:flex; align-items:center; flex-wrap:wrap; gap:10px 14px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px 16px; box-shadow:var(--shadow); margin-bottom:12px;}
.prog .big{font-size:30px; font-weight:800; color:var(--accent); line-height:1;} .prog .big small{font-size:14px; color:var(--text-2); font-weight:600;}
.prog .tx{font-size:13.5px; color:var(--text-2); line-height:1.5;} .prog .tx b{display:block; font-size:15px; color:var(--ink);}
.dots{display:flex; flex-wrap:wrap; gap:6px; flex:1 1 100%;} .dots i{width:14px; height:14px; border-radius:50%; background:var(--fill); border:1.5px solid var(--sep);} .dots i.on{background:var(--accent); border-color:var(--accent);}
.door{background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); margin:0 0 10px; overflow:hidden;}
.door>button{all:unset; box-sizing:border-box; width:100%; display:flex; align-items:center; gap:12px; padding:14px 14px; cursor:pointer;}
.door .ic{flex:0 0 46px; height:46px; border-radius:15px; background:var(--accent-bg); color:var(--accent); display:flex; align-items:center; justify-content:center;}
.door .ic svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
.door .hd{flex:1; min-width:0;} .door .hd b{display:block; font-size:17px; color:var(--ink); line-height:1.4; font-weight:800;} .door .hd span{display:block; font-size:13px; color:var(--text-2); line-height:1.55; margin-top:2px;}
.door .tk{flex:0 0 auto; width:26px; height:26px; border-radius:50%; border:2px solid var(--sep); display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; font-weight:800;}
.door.done .tk{background:var(--accent); border-color:var(--accent);}
.door .chev{flex:0 0 auto; width:18px; height:18px; fill:none; stroke:var(--text-3); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; transition:transform .2s;}
.door.open .chev{transform:rotate(90deg);}
.door .body{display:none; padding:0 14px 16px; border-top:1px solid var(--line);} .door.open .body{display:block;}
.sec{margin:14px 0 4px; font-size:13.5px; font-weight:800; color:var(--gold); letter-spacing:.2px;}
.q{font-family:'AmiriQuran','Amiri',serif; font-size:clamp(25px,6.8vw,29px); line-height:2.4; color:var(--qtext); text-align:center; direction:rtl; margin:0; word-spacing:2px; -webkit-text-stroke:.014em currentColor;}
.ref{display:block; text-align:center; font-size:12.5px; color:var(--text-3); font-weight:600; direction:rtl;}
.ex{padding:6px 12px 10px; border-radius:16px; background:var(--fill); border:1px solid var(--line);}
.h{margin:8px 0; padding:10px 12px; border-radius:16px; background:var(--fill); border:1px solid var(--line); border-inline-start:4px solid var(--accent);}
.ht{margin:0; font-size:17px; line-height:2.1; color:var(--ink); direction:rtl; text-align:start; font-weight:500;}
[dir=ltr] .ht{text-align:right;}
.hs{margin:6px 0 0; font-size:12.5px; color:var(--text-3); line-height:1.7; font-weight:600;}
.hm{margin:8px 0 0; padding:8px 10px; font-size:14px; line-height:1.85; color:var(--text-2); background:var(--gold-bg); border-radius:12px;}
.hm b{color:var(--gold);}
.stp{margin:4px 0 2px; padding-inline-start:22px;} .stp li{margin:6px 0; font-size:15px; color:var(--ink);}
.note{margin:6px 0 0; font-size:12.5px; color:var(--text-3);}
.act{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px;}
.act button{border:0; font:inherit; font-size:15px; font-weight:800; padding:11px 20px; border-radius:999px; cursor:pointer; min-height:44px; background:var(--accent); color:#fff;}
.act button.undo{background:var(--fill); color:var(--text-2);}
.act span{font-size:13px; color:var(--text-2);}
.qrf{margin:14px 14px 0; text-align:center; color:var(--text-3); font-size:12.5px;} .qrf .qrb{display:block; margin:10px auto 0; width:92px;} .qrf .qrb svg{display:block; width:92px; height:92px; border-radius:10px; border:1px solid var(--sep);}
.foot{margin:22px 14px 0; text-align:center; color:var(--text-3); font-size:12.5px; line-height:1.8;}

.tabs{position:sticky; top:0; z-index:5; display:flex; gap:8px; padding:10px 12px; background:var(--bg); border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{flex:1 0 auto; border:1px solid var(--line); background:var(--card); color:var(--text-2); font:inherit; font-size:14.5px; font-weight:700; padding:9px 18px; border-radius:20px; cursor:pointer; min-height:44px;}
.tabs button[aria-selected=true]{background:var(--accent); border-color:var(--accent); color:#fff;}
.card{background:var(--card); border-radius:20px; padding:18px 16px 16px; margin:12px 0; box-shadow:var(--shadow); border:1px solid var(--line);}
.card h2{margin:0 0 8px; font-size:18.5px; font-weight:800; color:var(--accent); line-height:1.5;}
.card h3{margin:14px 0 6px; font-size:15px; font-weight:700; color:var(--gold);}
.card p{margin:0 0 8px; font-size:15.5px; color:var(--ink);}
.ell{color:var(--text-3); font-family:'PlexAr'; font-size:17px;}
.lead{font-size:15px; color:var(--text-2); margin:6px 4px 4px; line-height:1.9;}
.lets{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 4px; direction:rtl;}
.lets b{min-width:42px; height:42px; display:inline-flex; align-items:center; justify-content:center; border-radius:13px; background:var(--accent-bg); color:var(--accent); font-size:24px; font-weight:700; font-family:'AmiriQuran','Amiri',serif; padding:0 6px;}
.lets b.g{background:var(--gold-bg); color:var(--gold);}
.badge{display:inline-block; margin:2px 0 8px; padding:3px 12px; border-radius:999px; font-size:13px; font-weight:700; background:var(--accent-bg); color:var(--accent);}
.exs{margin-top:10px; display:grid; gap:8px;}
.exr{padding:8px 12px 10px; border-radius:16px; background:var(--fill); border:1px solid var(--line);}
.exr .why{display:block; text-align:center; font-size:13px; color:var(--text-2); font-weight:700; margin-bottom:10px;}
.exr .acts{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:4px;}
.exr .acts button,.exr .acts a{border:1px solid var(--line); background:var(--card); color:var(--accent); font:inherit; font-size:13.5px; font-weight:700; padding:7px 14px; border-radius:999px; cursor:pointer; text-decoration:none; min-height:36px; display:inline-flex; align-items:center;}
.exr .acts button.on{background:var(--accent); color:#fff; border-color:var(--accent);}
.note{margin:10px 0 0; padding:10px 12px; font-size:14px; line-height:1.85; color:var(--text-2); background:var(--gold-bg); border-radius:14px; border-inline-start:3px solid var(--gold);}
.srcs{font-size:13.5px; color:var(--text-2);} .srcs li{margin:4px 0;}
.soon{font-size:13px; color:var(--text-3); text-align:center; margin:6px 0 0;}

@font-face{font-family:'Maghribi'; src:url('fonts/maghribi-520e7013.woff2') format('woff2'); font-display:swap;}
.q.w{font-family:'Maghribi','AmiriQuran',serif; font-size:clamp(23px,6.2vw,27px); line-height:2.7; -webkit-text-stroke:0;}
</style>
</head>

<script>
(function(){
'use strict';
var DATA = /*__DATA__*/null;
var $ = function(s){ return document.querySelector(s); };
function sget(k, d){ try{ var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }
function sset(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
/* قراءةٌ فقط من إعدادات التطبيق: الخلفيّةُ واللغة */
var S = sget('az_settings', {}) || {};
document.documentElement.setAttribute('data-bg', (S.bg === 'white' || S.bg === 'dark') ? S.bg : 'sepia');
var lang = sget('az_tajweed_lang', null) || S.lang || 'ar'; if (!DATA.ui[lang]) lang = 'ar';
var tab = (S.riwaya === 'hafs') ? 'hafs' : 'warsh';
var h = (location.hash || '').replace('#',''); if (h === 'hafs' || h === 'warsh') tab = h;
var audio = null, playing = null;

function play(btn, url){
  try{ if(audio){ audio.pause(); } }catch(e){}
  document.querySelectorAll('.acts button.on').forEach(function(b){ b.classList.remove('on'); });
  if (playing === url){ playing = null; return; }
  playing = url; btn.classList.add('on');
  audio = new Audio(url); audio.onended = function(){ btn.classList.remove('on'); playing = null; };
  audio.onerror = function(){ btn.classList.remove('on'); playing = null; };
  audio.play().catch(function(){ btn.classList.remove('on'); playing = null; });
}
function exHtml(e, L, hafs){
  var q = '<p class="q' + (hafs ? '' : ' w') + '">' + (e.pre ? '<span class="ell">… </span>' : '') + esc(e.t) + (e.post ? '<span class="ell"> …</span>' : '') + '</p>';
  var why = '<span class="why">' + esc(e.why[lang]) + '</span>';
  var ref = '<span class="ref">' + esc(e.ref) + '</span>';
  var acts = '';
  if (hafs){
    acts = '<div class="acts"><button type="button" data-play="' + esc(e.audio) + '">' + esc(L.listen) + '</button><a href="index.html#talqin-' + e.s + '-' + e.a + '">' + esc(L.repeat) + '</a></div>';
  }
  return '<div class="exr">' + why + q + ref + acts + '</div>';
}
function render(){
  var L = DATA.ui[lang], T = DATA[tab];
  document.documentElement.lang = lang; document.documentElement.dir = L.dir;
  document.title = L.title + ' — صلاتي';
  $('#h1').textContent = L.title; $('#sub').textContent = L.sub; $('#back-t').textContent = L.back; $('#foot').textContent = L.foot; $('#qr-t').textContent = L.qrT;
  document.querySelectorAll('.langs button').forEach(function(b){ b.classList.toggle('on', b.dataset.l === lang); });
  $('#tabs').innerHTML = ['hafs','warsh'].map(function(id,i){ return '<button role="tab" data-t="' + id + '" aria-selected="' + (tab===id) + '">' + esc(L.tabs[i]) + '</button>'; }).join('');
  $('#tabs').querySelectorAll('button').forEach(function(b){ b.onclick = function(){ tab = b.dataset.t; render(); window.scrollTo(0,0); }; });
  var hafs = tab === 'hafs', ls = DATA.lesson, h = '';
  h += '<div class="card"><h2>' + esc(ls.title[lang]) + '</h2>';
  ls.intro.forEach(function(p){ h += '<p>' + esc(p[lang]) + '</p>'; });
  h += '<div class="note">' + esc(L.teacher) + '</div></div>';
  if (!hafs){ h += '<div class="card"><h2>' + esc(L.warshT) + '</h2>'; ls.warshNotes.forEach(function(p){ h += '<p>' + esc(p[lang]) + '</p>'; }); h += '</div>'; }
  ls.rules.forEach(function(r){
    h += '<div class="card"><h2>' + esc(r.t[lang]) + '</h2><span class="badge">' + esc(r.tag[lang]) + '</span><p>' + esc(r.def[lang]) + '</p>';
    r.groups.forEach(function(g){
      h += '<h3>' + esc(g.t[lang]) + '</h3><div class="lets">' + g.l.map(function(c){ return '<b' + (g.gold ? ' class="g"' : '') + '>' + esc(c) + '</b>'; }).join('') + '</div>';
      if (g.d) h += '<p style="font-size:14px;color:var(--text-2)">' + esc(g.d[lang]) + '</p>';
    });
    if (r.extra) h += '<div class="note">' + esc(r.extra[lang]) + '</div>';
    var ex = r.ex.filter(function(e){ return !!e[tab]; });
    if (ex.length){ h += '<h3>' + esc(L.examples) + '</h3><div class="exs">' + ex.map(function(e){ return exHtml(e[tab], L, hafs); }).join('') + '</div>'; }
    if (!hafs) h += '<p class="soon">' + esc(L.noAudio) + '</p>';
    h += '</div>';
  });
  h += '<div class="card srcs"><h2>' + esc(L.refs) + '</h2><ul>' + DATA.refs.map(function(x){ return '<li>' + esc(x[lang]) + '</li>'; }).join('') + '</ul></div>';
  $('#main').innerHTML = h;
  $('#main').querySelectorAll('[data-play]').forEach(function(b){ b.onclick = function(){ play(b, b.getAttribute('data-play')); }; });
}
document.querySelectorAll('.langs button').forEach(function(b){ b.onclick = function(){ lang = b.dataset.l; sset('az_tajweed_lang', lang); render(); }; });
render();
})();
</script>
