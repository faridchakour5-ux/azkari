<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bg="sepia">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0A5441">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preload" href="fonts/amiri-quran.woff2" as="font" type="font/woff2" crossorigin>
<title>أبواب الخير — صلاتي</title>
<style>
@font-face{font-family:'PlexAr'; src:url('fonts/ui-400.woff2') format('woff2'); font-weight:400; font-display:swap;}
@font-face{font-family:'PlexAr'; src:url('fonts/ui-600.woff2') format('woff2'); font-weight:600; font-display:swap;}
@font-face{font-family:'PlexAr'; src:url('fonts/ui-700.woff2') format('woff2'); font-weight:700; font-display:swap;}
@font-face{font-family:'AmiriQuran'; src:url('fonts/amiri-quran.woff2') format('woff2'); font-display:swap;}
:root{
  --bg:#EFE6D4; --card:#F6EDDB; --text:#3A352E; --text-2:rgba(58,53,46,.62); --text-3:rgba(58,53,46,.34);
  --sep:rgba(58,53,46,.16); --line:rgba(58,53,46,.09); --fill:rgba(120,105,80,.12);
  --accent:#0B5742; --accent-2:#08463A; --accent-bg:rgba(11,87,66,.10); --gold:#A8741A; --gold-bg:rgba(168,116,26,.12);
  --ink:#063D30; --qtext:#0A5441;
  --shadow:0 1px 2px rgba(58,53,46,.05), 0 4px 14px rgba(58,53,46,.06);
}
:root[data-bg="white"]{ --bg:#F2F2F7; --card:#FAFAF8; --text:#2B2B2B; --text-2:rgba(43,43,43,.6); --text-3:rgba(43,43,43,.32); --sep:rgba(43,43,43,.16); --line:rgba(43,43,43,.08); --fill:rgba(120,120,128,.1); }
:root[data-bg="dark"]{ --bg:#121212; --card:#1E1E1E; --text:#E6E1D6; --text-2:rgba(230,225,214,.62); --text-3:rgba(230,225,214,.32); --sep:rgba(230,225,214,.14); --line:rgba(255,255,255,.07); --fill:rgba(200,200,200,.08);
  --accent:#34C77B; --accent-2:#2BAA68; --accent-bg:rgba(52,199,123,.16); --gold:#E3B25A; --gold-bg:rgba(227,178,90,.14); --ink:#CDEFE0; --qtext:#4CC79B;
  --shadow:0 1px 3px rgba(0,0,0,.45), 0 5px 16px rgba(0,0,0,.35); }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--text); font-family:'PlexAr',system-ui,sans-serif; line-height:1.85; -webkit-font-smoothing:antialiased; padding-bottom:calc(36px + env(safe-area-inset-bottom,0px));}
a{color:var(--accent);}
.hero{position:relative; overflow:hidden; color:#fff; padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 26px; background:linear-gradient(160deg,#0E6B52 0%,#0A5441 48%,#063D30 100%);}
.hero::before{content:''; position:absolute; inset-inline-end:-60px; top:-60px; width:230px; height:230px; border-radius:50%; border:1.5px solid rgba(255,255,255,.14); box-shadow:0 0 0 26px rgba(255,255,255,.05), 0 0 0 52px rgba(255,255,255,.03);}
.hero::after{content:''; position:absolute; inset-inline:0; bottom:0; height:2px; background:linear-gradient(90deg,transparent,#D9B15C 30%,#D9B15C 70%,transparent);}
.hero-top{position:relative; display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:18px;}
.back{display:inline-flex; align-items:center; gap:6px; flex:0 0 auto; white-space:nowrap; color:#fff; text-decoration:none; font-weight:600; font-size:13.5px; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,.12);}
.back svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
[dir=ltr] .back svg{transform:scaleX(-1);}
.langs{display:flex; gap:4px; background:rgba(255,255,255,.12); padding:3px; border-radius:999px; direction:ltr;}
.langs button{border:0; background:transparent; color:#fff; font:inherit; font-size:12.5px; font-weight:600; padding:5px 9px; border-radius:999px; cursor:pointer;}
.langs button.on{background:#fff; color:#063D30;}
.hero h1{position:relative; margin:0 0 6px; font-size:clamp(26px,7.4vw,34px); line-height:1.35; font-weight:800; color:#fff;}
.hero p{position:relative; margin:0; font-size:14.5px; color:rgba(255,255,255,.86); font-weight:500; max-width:34em;}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
main{max-width:720px; margin:0 auto; padding:14px max(10px,env(safe-area-inset-left)) 0;}
.prog{display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px 16px; box-shadow:var(--shadow); margin-bottom:12px;}
.prog .big{font-size:30px; font-weight:800; color:var(--accent); line-height:1;} .prog .big small{font-size:14px; color:var(--text-2); font-weight:600;}
.prog .tx{font-size:13.5px; color:var(--text-2); line-height:1.5;} .prog .tx b{display:block; font-size:15px; color:var(--ink);}
.dots{display:flex; gap:6px; margin-inline-start:auto;} .dots i{width:14px; height:14px; border-radius:50%; background:var(--fill); border:1.5px solid var(--sep);} .dots i.on{background:var(--accent); border-color:var(--accent);}
.door{background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); margin:0 0 10px; overflow:hidden;}
.door>button{all:unset; box-sizing:border-box; width:100%; display:flex; align-items:center; gap:12px; padding:14px 14px; cursor:pointer;}
.door .ic{flex:0 0 46px; height:46px; border-radius:15px; background:var(--accent-bg); color:var(--accent); display:flex; align-items:center; justify-content:center;}
.door .ic svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
.door .hd{flex:1; min-width:0;} .door .hd b{display:block; font-size:17px; color:var(--ink); line-height:1.4; font-weight:800;} .door .hd span{display:block; font-size:13px; color:var(--text-2); line-height:1.55; margin-top:2px;}
.door .tk{flex:0 0 auto; width:26px; height:26px; border-radius:50%; border:2px solid var(--sep); display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; font-weight:800;}
.door.done .tk{background:var(--accent); border-color:var(--accent);}
.door .chev{flex:0 0 auto; width:18px; height:18px; fill:none; stroke:var(--text-3); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; transition:transform .2s;}
.door.open .chev{transform:rotate(90deg);}
.door .body{display:none; padding:0 14px 16px; border-top:1px solid var(--line);} .door.open .body{display:block;}
.sec{margin:14px 0 4px; font-size:13.5px; font-weight:800; color:var(--gold); letter-spacing:.2px;}
.q{font-family:'AmiriQuran','Amiri',serif; font-size:clamp(25px,6.8vw,29px); line-height:2.4; color:var(--qtext); text-align:center; direction:rtl; margin:0; word-spacing:2px; -webkit-text-stroke:.014em currentColor;}
.ref{display:block; text-align:center; font-size:12.5px; color:var(--text-3); font-weight:600; direction:rtl;}
.ex{padding:6px 12px 10px; border-radius:16px; background:var(--fill); border:1px solid var(--line);}
.h{margin:8px 0; padding:10px 12px; border-radius:16px; background:var(--fill); border:1px solid var(--line); border-inline-start:4px solid var(--accent);}
.ht{margin:0; font-size:17px; line-height:2.1; color:var(--ink); direction:rtl; text-align:start; font-weight:500;}
[dir=ltr] .ht{text-align:right;}
.hs{margin:6px 0 0; font-size:12.5px; color:var(--text-3); line-height:1.7; font-weight:600;}
.hm{margin:8px 0 0; padding:8px 10px; font-size:14px; line-height:1.85; color:var(--text-2); background:var(--gold-bg); border-radius:12px;}
.hm b{color:var(--gold);}
.stp{margin:4px 0 2px; padding-inline-start:22px;} .stp li{margin:6px 0; font-size:15px; color:var(--ink);}
.note{margin:6px 0 0; font-size:12.5px; color:var(--text-3);}
.act{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px;}
.act button{border:0; font:inherit; font-size:15px; font-weight:800; padding:11px 20px; border-radius:999px; cursor:pointer; min-height:44px; background:var(--accent); color:#fff;}
.act button.undo{background:var(--fill); color:var(--text-2);}
.act span{font-size:13px; color:var(--text-2);}
.foot{margin:22px 14px 0; text-align:center; color:var(--text-3); font-size:12.5px; line-height:1.8;}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-top">
    <a class="back" id="back" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span id="back-t">العودة</span></a>
    <div class="langs" role="group" aria-label="Language"><button data-l="ar">العربية</button><button data-l="fr">Français</button><button data-l="en">English</button></div>
  </div>
  <h1 id="h1"></h1>
  <p id="sub"></p>
</header>
<main id="main"></main>
<p class="foot" id="foot"></p>
<script>
(function(){
'use strict';
var DATA = /*__DATA__*/null;
var $ = function(s){ return document.querySelector(s); };
var KEY = 'az_khayr';
function sget(k, d){ try{ var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }
function sset(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function dayKey(d){ d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

/* قراءةٌ فقط من إعدادات التطبيق: الخلفيّةُ واللغة */
var S = sget('az_settings', {}) || {};
var bg = (S.bg === 'white' || S.bg === 'dark') ? S.bg : 'sepia';
document.documentElement.setAttribute('data-bg', bg);
var lang = sget('az_khayr_lang', null) || S.lang || 'ar';
if (!DATA.ui[lang]) lang = 'ar';
var openId = null;

function prog(){ var p = sget(KEY, {}); return (p && typeof p === 'object') ? p : {}; }
function isDone(P, id, k){ return !!(P[id] && P[id][k]); }
function monthCount(P, id){ var m = dayKey().slice(0,7), n = 0; Object.keys(P[id] || {}).forEach(function(k){ if (k.slice(0,7) === m) n++; }); return n; }
function toggle(id){
  var P = prog(), k = dayKey(); P[id] = P[id] || {};
  if (P[id][k]) delete P[id][k]; else P[id][k] = 1;
  var ks = Object.keys(P[id]).sort(); while (ks.length > 400) delete P[id][ks.shift()];
  sset(KEY, P); render();
}

function sourceLine(h, L){
  if (lang === 'ar') return h.s;
  return L.by[h.k] + ' · ' + L.narrator + ': ' + h.who[lang];
}

function render(){
  var L = DATA.ui[lang], P = prog(), k = dayKey();
  document.documentElement.lang = lang; document.documentElement.dir = L.dir;
  document.title = L.title + ' — صلاتي';
  $('#h1').textContent = L.title; $('#sub').textContent = L.sub; $('#back-t').textContent = L.back; $('#foot').textContent = L.foot;
  document.querySelectorAll('.langs button').forEach(function(b){ b.classList.toggle('on', b.dataset.l === lang); });
  var n = DATA.doors.filter(function(d){ return isDone(P, d.id, k); }).length;
  var h = '<div class="prog"><div class="big">' + n + ' <small>' + L.of + ' ' + DATA.doors.length + '</small></div><div class="tx"><b>' + esc(L.today) + '</b>' + esc(L.doorsDone) + '</div><div class="dots" aria-hidden="true">' +
    DATA.doors.map(function(d){ return '<i class="' + (isDone(P, d.id, k) ? 'on' : '') + '"></i>'; }).join('') + '</div></div>';
  DATA.doors.forEach(function(d){
    var done = isDone(P, d.id, k), open = openId === d.id;
    h += '<article class="door' + (done ? ' done' : '') + (open ? ' open' : '') + '" id="d-' + d.id + '"><button type="button" data-id="' + d.id + '" aria-expanded="' + open + '">' +
      '<span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">' + d.ic + '</svg></span><span class="hd"><b>' + esc(d.ti[lang]) + '</b><span>' + esc(d.sub[lang]) + '</span></span>' +
      '<span class="tk" aria-hidden="true">' + (done ? '✓' : '') + '</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="' + (L.dir === 'rtl' ? 'M15 6l-6 6 6 6' : 'M9 6l6 6-6 6') + '"/></svg></button>';
    if (open){
      h += '<div class="body"><div class="sec">' + esc(L.verses) + '</div><div class="ex"><p class="q">' + esc(d.aya.t) + '</p><span class="ref">' + esc(d.aya.s) + '</span></div>' +
        '<div class="sec">' + esc(L.hadith) + '</div>' +
        d.had.map(function(x){ return '<div class="h"><p class="ht">' + esc(x.t) + '</p><p class="hs">' + esc(sourceLine(x, L)) + '</p><p class="hm"><b>' + esc(L.meaning) + ':</b> ' + esc(x.m[lang]) + '</p></div>'; }).join('') +
        '<div class="sec">' + esc(L.steps) + '</div><ul class="stp">' + d.steps[lang].map(function(s){ return '<li>' + esc(s) + '</li>'; }).join('') + '</ul><p class="note">' + esc(L.stepsNote) + '</p>' +
        '<div class="act"><button type="button" class="' + (done ? 'undo' : '') + '" data-do="' + d.id + '">' + esc(done ? L.undo : L.did) + '</button><span>' + monthCount(P, d.id) + ' ' + esc(L.month) + '</span></div></div>';
    }
    h += '</article>';
  });
  $('#main').innerHTML = h;
  $('#main').querySelectorAll('.door>button').forEach(function(b){ b.onclick = function(){ openId = (openId === b.dataset.id) ? null : b.dataset.id; render(); if (openId){ var el = $('#d-' + openId); if (el && el.scrollIntoView) el.scrollIntoView({block:'nearest'}); } }; });
  $('#main').querySelectorAll('[data-do]').forEach(function(b){ b.onclick = function(){ toggle(b.dataset['do']); }; });
}
document.querySelectorAll('.langs button').forEach(function(b){ b.onclick = function(){ lang = b.dataset.l; sset('az_khayr_lang', lang); render(); }; });
render();
})();
</script>
</body>
</html>
