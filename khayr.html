<style>

:root{

}
:root[data-bg="white"]{ --bg:#F2F2F7; --card:#FAFAF8; --text:#2B2B2B; --text-2:rgba(43,43,43,.6); --text-3:rgba(43,43,43,.32); --sep:rgba(43,43,43,.16); --line:rgba(43,43,43,.08); --fill:rgba(120,120,128,.1); }

  --shadow:0 1px 3px rgba(0,0,0,.45), 0 5px 16px rgba(0,0,0,.35); }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--text); font-family:'PlexAr',system-ui,sans-serif; line-height:1.85; -webkit-font-smoothing:antialiased; padding-bottom:calc(36px + env(safe-area-inset-bottom,0px));}
a{color:var(--accent);}
.hero{position:relative; overflow:hidden; color:#fff; padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 26px; background:linear-gradient(160deg,#0E6B52 0%,#0A5441 48%,#063D30 100%);}
.hero::before{content:''; position:absolute; inset-inline-end:-60px; top:-60px; width:230px; height:230px; border-radius:50%; border:1.5px solid rgba(255,255,255,.14); box-shadow:0 0 0 26px rgba(255,255,255,.05), 0 0 0 52px rgba(255,255,255,.03);}

.hero-top{position:relative; display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:18px;}

.langs button.on{background:#fff; color:#063D30;}
.hero h1{position:relative; margin:0 0 6px; font-size:clamp(26px,7.4vw,34px); line-height:1.35; font-weight:800; color:#fff;}

:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

.door.done .tk{background:var(--accent); border-color:var(--accent);}
.door .chev{flex:0 0 auto; width:18px; height:18px; fill:none; stroke:var(--text-3); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; transition:transform .2s;}

.ref{display:block; text-align:center; font-size:12.5px; color:var(--text-3); font-weight:600; direction:rtl;}

.h{margin:8px 0; padding:10px 12px; border-radius:16px; background:var(--fill); border:1px solid var(--line); border-inline-start:4px solid var(--accent);}
.ht{margin:0; font-size:17px; line-height:2.1; color:var(--ink); direction:rtl; text-align:start; font-weight:500;}
[dir=ltr] .ht{text-align:right;}
.hs{margin:6px 0 0; font-size:12.5px; color:var(--text-3); line-height:1.7; font-weight:600;}
.hm{margin:8px 0 0; padding:8px 10px; font-size:14px; line-height:1.85; color:var(--text-2); background:var(--gold-bg); border-radius:12px;}
.hm b{color:var(--gold);}
.stp{margin:4px 0 2px; padding-inline-start:22px;} .stp li{margin:6px 0; font-size:15px; color:var(--ink);}
.note{margin:6px 0 0; font-size:12.5px; color:var(--text-3);}
.act{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px;}
.act button{border:0; font:inherit; font-size:15px; font-weight:800; padding:11px 20px; border-radius:999px; cursor:pointer; min-height:44px; background:var(--accent); color:#fff;}
.act button.undo{background:var(--fill); color:var(--text-2);}
.act span{font-size:13px; color:var(--text-2);}
.foot{margin:22px 14px 0; text-align:center; color:var(--text-3); font-size:12.5px; line-height:1.8;}

o": {"fr": "Abu Hurayra", "en": "Abu Hurayrah"}, "m": {"ar": "قدّم النبيُّ ﷺ الأمَّ ثلاثَ مرّات ثم ذكر الأب. وقد علّل العلماءُ ذلك بما تحمّلته الأمُّ من الحمل والولادة والرضاع والتربية.", "fr": "Le Prophète ﷺ a cité la mère trois fois avant le père. Les savants l’expliquent par ce que la mère endure : grossesse, accouchement, allaitement, éducation.", "en": "The Prophet ﷺ named the mother three times before the father. Scholars explain this by what a mother bears: pregnancy, childbirth, nursing and upbringing."}}, {"t": "«سَأَلْتُ رَسُولَ اللَّهِ ﷺ قُلْتُ يَا رَسُولَ اللَّهِ أَىُّ الْعَمَلِ أَفْضَلُ قَالَ الصَّلاَةُ عَلَى مِيقَاتِهَا. قُلْتُ ثُمَّ أَىٌّ. قَالَ ثُمَّ بِرُّ الْوَالِدَيْنِ. قُلْتُ ثُمَّ أَىٌّ قَالَ الْجِهَادُ فِي سَبِيلِ اللَّهِ»", "s": "رواه البخاري (كتاب الجهاد والسير). عن عبد الله بن مسعود رضي الله عنه.", "k": "bukhari", "who": {"fr": "Ibn Mas‘ud", "en": "Ibn Mas‘ud"}, "m": {"ar": "بعد الصلاة في وقتها يأتي برُّ الوالدين في ترتيب الأعمال التي يحبّها الله.", "fr": "Après la prière à son heure vient la bonté envers les parents, parmi les œuvres qu’Allah aime.", "en": "After prayer at its time comes kindness to parents, among the deeds Allah loves."}}, {"t": "«رَغِمَ أَنْفُ ثُمَّ رَغِمَ أَنْفُ ثُمَّ رَغِمَ أَنْفُ. قِيلَ مَنْ يَا رَسُولَ اللَّهِ قَالَ مَنْ أَدْرَكَ أَبَوَيْهِ عِنْدَ الْكِبَرِ أَحَدَهُمَا أَوْ كِلَيْهِمَا فَلَمْ يَدْخُلِ الْجَنَّةَ»", "s": "رواه مسلم (كتاب البر والصلة والآداب). عن أبي هريرة رضي الله عنه.", "k": "muslim", "who": {"fr": "Abu Hurayra", "en": "Abu Hurayrah"}, "m": {"ar": "الخاسرُ من أدرك والديه أو أحدَهما في الكِبَر، فلم يكن بِرُّه لهما سببًا لدخوله الجنة.", "fr": "Est perdant celui qui trouve ses parents, l’un ou les deux, dans leur vieillesse sans que sa bonté envers eux ne devienne un chemin vers le Paradis.", "en": "Ruined is the one who reaches his parents in their old age, one or both, and does not enter Paradise through kindness to them."}}], "steps": {"ar": ["اتصل بوالديك أو زُرهما اليوم، ولو دقائق قليلة.", "قل لهما كلمةً طيّبة، واحبس غضبَك وأنت بحضرتهما.", "اعرض عليهما مساعدةً في عملٍ ثقيل عليهما.", "ادعُ لهما بالرحمة والمغفرة، حيّين كانا أو ميّتين."], "fr": ["Appelez ou rendez visite à vos parents aujourd’hui, même quelques minutes.", "Dites-leur une bonne parole et retenez votre colère en leur présence.", "Proposez-leur de l’aide pour une tâche qui leur pèse.", "Invoquez pour eux la miséricorde et le pardon, qu’ils soient vivants ou décédés."], "en": ["Call or visit your parents today, even for a few minutes.", "Say a kind word and hold back your anger in their presence.", "Offer help with a task that is heavy for them.", "Make du‘a for their mercy and forgiveness, whether they are alive or have passed away."]}}, {"id": "sadaqa", "ic": "<path d=\"M12 3v4M8 7h8M7 11h10l-1 9H8z\"/>", "ti": {"ar": "الصدقة", "fr": "L’aumône", "en": "Charity"}, "sub": {"ar": "ولو بالقليل؛ فهي لا تُنقص المال", "fr": "Même peu : elle ne diminue pas la richesse", "en": "Even a little: it does not diminish wealth"}, "aya": {"t": "مَّثَلُ ٱلَّذِينَ يُنفِقُونَ أَمۡوَٰلَهُمۡ فِي سَبِيلِ ٱللَّهِ كَمَثَلِ حَبَّةٍ أَنۢبَتَتۡ سَبۡعَ سَنَابِلَ فِي كُلِّ سُنۢبُلَةٖ مِّاْئَةُ حَبَّةٖۗ وَٱللَّهُ يُضَٰعِفُ لِمَن يَشَآءُۚ وَٱللَّهُ وَٰسِعٌ عَلِيمٌ", "s": "سورة البقرة، الآية 261"}, "had": [{"t": "«مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ وَمَا زَادَ اللَّهُ عَبْدًا بِعَفْوٍ إِلاَّ عِزًّا وَمَا تَوَاضَعَ أَحَدٌ لِلَّهِ إِلاَّ رَفَعَهُ اللَّهُ»", "s": "رواه مسلم (كتاب البر والصلة والآداب). عن أبي هريرة رضي الله عنه.", "k": "muslim", "who": {"fr": "Abu Hurayra", "en": "Abu Hurayrah"}, "m": {"ar": "الصدقةُ لا تنقص المال حقيقةً، بل يُبارك الله فيه ويُخلف على صاحبه. والعفوُ والتواضعُ يرفعان صاحبَهما.", "fr": "L’aumône ne diminue pas réellement la richesse : Allah y met la bénédiction et la remplace. Le pardon et l’humilité élèvent celui qui les pratique.", "en": "Charity does not truly reduce wealth: Allah blesses it and replaces it. Forgiveness and humility raise the one who practises them."}}, {"t": "«اتَّقُوا النَّارَ وَلَوْ بِشِقِّ تَمْرَةٍ»", "s": "متّفقٌ عليه — البخاري (كتاب الزكاة · كتاب الأدب) ، مسلم (كتاب الزكاة). عن عدي بن حاتم رضي الله عنه.", "k": "both", "who": {"fr": "ʿAdi ibn Hatim", "en": "ʿAdi ibn Hatim"}, "m": {"ar": "حثٌّ على الصدقة ولو بالقليل؛ فلا يحتقر أحدٌ ما يتصدّق به.", "fr": "Encouragement à donner, même peu : que personne ne méprise ce qu’il donne.", "en": "An encouragement to give even a little: let no one belittle what they give."}}, {"t": "«السَّاعِي عَلَى الأَرْمَلَةِ وَالْمِسْكِينِ كَالْمُجَاهِدِ فِي سَبِيلِ اللَّهِ، أَوِ الْقَائِمِ اللَّيْلَ الصَّائِمِ النَّهَارَ»", "s": "متّفقٌ عليه — البخاري (كتاب النفقات · كتاب الأدب) ، مسلم (كتاب الزهد والرقائق). عن أبي هريرة رضي الله عنه.", "k": "both", "who": {"fr": "Abu Hurayra", "en": "Abu Hurayrah"}, "m": {"ar": "من يسعى لكفاية الأرملة والمسكين وقضاء حاجتهما له أجرٌ عظيم.", "fr": "Celui qui s’emploie à subvenir aux besoins de la veuve et du pauvre obtient une grande récompense.", "en": "One who strives to provide for the widow and the poor earns a great reward."}}], "steps": {"ar": ["خصّص مبلغًا صغيرًا ثابتًا كلَّ يوم ولو كان يسيرًا، فالدائمُ القليل خيرٌ من الكثير المنقطع.", "تصدّق خفيةً ما استطعت.", "أطعِم جائعًا أو اشترِ لمحتاجٍ حاجةً يحتاجها.", "اسأل عن جارٍ أو قريبٍ محتاجٍ فابدأ به."], "fr": ["Fixez un petit montant chaque jour, même modeste : le peu régulier vaut mieux que le beaucoup interrompu.", "Donnez discrètement autant que possible.", "Nourrissez une personne affamée ou offrez à un nécessiteux ce dont il a besoin.", "Informez-vous d’un voisin ou d’un proche dans le besoin et commencez par lui."], "en": ["Set aside a small fixed amount each day, however modest: steady and small beats large and interrupted.", "Give discreetly whenever you can.", "Feed someone hungry or buy something a needy person requires.", "Ask about a neighbour or relative in need and start with them."]}}, {"id": "rahim", "ic": "<circle cx=\"8\" cy=\"8\" r=\"3\"/><circle cx=\"17\" cy=\"9\" r=\"2.5\"/><path d=\"M2.5 20c.6-3.4 3-5 5.5-5s4.9 1.6 5.5 5M15 15.4c3 0 5 1.4 6 4.6\"/>", "ti": {"ar": "صلة الرحم", "fr": "Les liens de parenté", "en": "Keeping family ties"}, "sub": {"ar": "سببٌ للبركة في الرزق والعمر", "fr": "Cause de bénédiction dans la subsistance et la vie", "en": "A cause of blessing in provision and life"}, "aya": {"t": "وَٱلَّذِينَ يَصِلُونَ مَآ أَمَرَ ٱللَّهُ بِهِۦٓ أَن يُوصَلَ وَيَخۡشَوۡنَ رَبَّهُمۡ وَيَخَافُونَ سُوٓءَ ٱلۡحِسَابِ", "s": "سورة الرّعد، الآية 21"}, "had": [{"t": "«مَنْ أَحَبَّ أَنْ يُبْسَطَ لَهُ فِي رِزْقِهِ، وَيُنْسَأَ لَهُ فِي أَثَرِهِ، فَلْيَصِلْ رَحِمَهُ»", "s": "متّفقٌ عليه — البخاري (كتاب الأدب) ، مسلم (كتاب البر والصلة والآداب). عن أنس بن مالك رضي الله عنه.", "k": "both", "who": {"fr": "Anas ibn Malik", "en": "Anas ibn Malik"}, "m": {"ar": "صلةُ الرحم سببٌ للبركة في الرزق وفي العمر بإذن الله.", "fr": "Maintenir les liens de parenté est une cause de bénédiction dans la subsistance et dans la vie, par la permission d’Allah.", "en": "Keeping family ties is a cause of blessing in provision and in life, by Allah’s permission."}}, {"t": "«لاَ يَدْخُلُ الْجَنَّةَ قَاطِعٌ»", "s": "متّفقٌ عليه — البخاري (كتاب الأدب) ، مسلم (كتاب البر والصلة والآداب). عن جبير بن مطعم رضي الله عنه.", "k": "both", "who": {"fr": "Jubayr ibn Mut‘im", "en": "Jubayr ibn Mut‘im"}, "m": {"ar": "تحذيرٌ شديد من قطع الرحم. وللعلماء توجيهاتٌ في معنى هذا الوعيد، لكنّ المقصودَ أنّ القطيعة ذنبٌ عظيم.", "fr": "Mise en garde sévère contre la rupture des liens. Les savants ont des explications sur le sens de cette menace, mais l’essentiel est que la rupture est un grand péché.", "en": "A severe warning against cutting family ties. Scholars have explanations of this threat, but the point is that cutting ties is a grave sin."}}], "steps": {"ar": ["اتصل بقريبٍ لم تسأل عنه منذ مدّة.", "أرسل رسالةَ سلامٍ أو دعاءٍ إلى قريبٍ بعيد.", "زُر مريضًا أو كبيرًا من أهلك.", "سامِح قريبًا أخطأ في حقّك وابدأ بالسلام."], "fr": ["Appelez un proche dont vous n’avez pas pris de nouvelles depuis longtemps.", "Envoyez un message de salutations ou une invocation à un proche éloigné.", "Rendez visite à un malade ou à une personne âgée de votre famille.", "Pardonnez à un proche qui vous a lésé et commencez par le salut."], "en": ["Call a relative you have not asked after for a while.", "Send a greeting or a du‘a to a distant relative.", "Visit a sick or elderly family member.", "Forgive a relative who wronged you and begin with the greeting of peace."]}}, {"id": "jar", "ic": "<path d=\"M3 11l9-7 9 7v9H3zM9 20v-6h6v6\"/>", "ti": {"ar": "الإحسان إلى الجار", "fr": "Bien traiter le voisin", "en": "Being good to the neighbour"}, "sub": {"ar": "أوصى به جبريل حتى ظنّ النبيُّ ﷺ أنه سيُورِّثه", "fr": "Jibrîl l’a tant recommandé que le Prophète ﷺ a cru qu’il hériterait", "en": "Jibril kept urging it until the Prophet ﷺ thought the neighbour would inherit"}, "aya": {"t": "۞ وَٱعۡبُدُواْ ٱللَّهَ وَلَا تُشۡرِكُواْ بِهِۦ شَيۡـٔٗاۖ وَبِٱلۡوَٰلِدَيۡنِ إِحۡسَٰنٗا وَبِذِي ٱلۡقُرۡبَىٰ وَٱلۡيَتَٰمَىٰ وَٱلۡمَسَٰكِينِ وَٱلۡجَارِ ذِي ٱلۡقُرۡبَىٰ وَٱلۡجَارِ ٱلۡجُنُبِ وَٱلصَّاحِبِ بِٱلۡجَنۢبِ وَٱبۡنِ ٱلسَّبِيلِ وَمَا مَلَكَتۡ أَيۡمَٰنُكُمۡۗ إِنَّ ٱللَّهَ لَا يُحِبُّ مَن كَانَ مُخۡتَالٗا فَخُورًا", "s": "سورة النّساء، الآية 36"}, "had": [{"t": "«مَا زَالَ جِبْرِيلُ يُوصِينِي بِالْجَارِ حَتَّى ظَنَنْتُ أَنَّهُ سَيُوَرِّثُهُ»", "s": "متّفقٌ عليه — البخاري (كتاب الأدب) ، مسلم (كتاب البر والصلة والآداب). عن عبد الله بن عمر رضي الله عنهما.", "k": "both", "who": {"fr": "Ibn ‘Umar", "en": "Ibn ‘Umar"}, "m": {"ar": "مبالغةٌ في بيان عِظَم حقّ الجار.", "fr": "Une insistance sur l’importance du droit du voisin.", "en": "An emphasis on how great the neighbour’s right is."}}, {"t": "«يَا نِسَاءَ الْمُسْلِمَاتِ لاَ تَحْقِرَنَّ جَارَةٌ لِجَارَتِهَا، وَلَوْ فِرْسِنَ شَاةٍ»", "s": "متّفقٌ عليه — البخاري (كتاب الهبة وفضلها والتحريض عليها · كتاب الأدب) ، مسلم (كتاب الزكاة). عن أبي هريرة رضي الله عنه.", "k": "both", "who": {"fr": "Abu Hurayra", "en": "Abu Hurayrah"}, "m": {"ar": "لا تستقلّ ما تُهديه لجارك ولو كان يسيرًا (فِرْسِن الشاة: ظِلْفُها).", "fr": "Ne minimisez pas ce que vous offrez à votre voisin, même si c’est peu (le sabot d’un mouton).", "en": "Do not belittle what you give your neighbour, however little (a sheep’s trotter)."}}, {"t": "«يَا أَبَا ذَرٍّ إِذَا طَبَخْتَ مَرَقَةً فَأَكْثِرْ مَاءَهَا وَتَعَاهَدْ جِيرَانَكَ»", "s": "رواه مسلم (كتاب البر والصلة والآداب). عن أبي ذر رضي الله عنه.", "k": "muslim", "who": {"fr": "Abu Dharr", "en": "Abu Dharr"}, "m": {"ar": "توجيهٌ إلى مشاركة الجيران بشيءٍ من الطعام كلّما تيسّر.", "fr": "Une orientation à partager avec les voisins un peu de nourriture chaque fois que c’est possible.", "en": "Guidance to share some food with the neighbours whenever possible."}}], "steps": {"ar": ["سلِّم على جارك وابتسم له.", "أهدِ جارَك شيئًا بسيطًا من طعامك.", "اسأل عن جارٍ مريضٍ أو كبيرٍ في السنّ.", "تجنّب كلَّ ما يؤذي جارك: الضجيج، وسدَّ الطريق، والكلامَ السيّئ."], "fr": ["Saluez votre voisin avec un sourire.", "Offrez-lui un peu de votre repas.", "Prenez des nouvelles d’un voisin malade ou âgé.", "Évitez tout ce qui le dérange : le bruit, l’obstruction du passage, les mauvaises paroles."], "en": ["Greet your neighbour with a smile.", "Share a little of your food with them.", "Check on a sick or elderly neighbour.", "Avoid whatever bothers them: noise, blocking the way, unkind words."]}}, {"id": "yatim", "ic": "<circle cx=\"12\" cy=\"7\" r=\"3\"/><path d=\"M5 21c0-4.4 3-7 7-7s7 2.6 7 7\"/>", "ti": {"ar": "كفالة اليتيم", "fr": "Prendre en charge un orphelin", "en": "Caring for an orphan"}, "sub": {"ar": "قربٌ من النبيّ ﷺ في الجنة", "fr": "Une proximité avec le Prophète ﷺ au Paradis", "en": "Nearness to the Prophet ﷺ in Paradise"}, "aya": {"t": "فَأَمَّا ٱلۡيَتِيمَ فَلَا تَقۡهَرۡ وَأَمَّا ٱلسَّآئِلَ فَلَا تَنۡهَرۡ", "s": "سورة الضُّحى، الآيات ⁦9–10⁩"}, "had": [{"t": "«أَنَا وَكَافِلُ الْيَتِيمِ فِي الْجَنَّةِ هَكَذَا»", "s": "رواه البخاري (كتاب الطلاق · كتاب الأدب). عن سهل بن سعد رضي الله عنه.", "k": "bukhari", "who": {"fr": "Sahl ibn Sa‘d", "en": "Sahl ibn Sa‘d"}, "m": {"ar": "كافلُ اليتيم هو القائم بأمره من نفقةٍ وتربيةٍ ورعاية، وله منزلةٌ قريبة من النبيّ ﷺ في الجنة. وأشار ﷺ بالسبابة والوسطى مبيّنًا قربَهما.", "fr": "Le tuteur de l’orphelin est celui qui s’occupe de lui : dépenses, éducation, soin. Il a un rang proche du Prophète ﷺ au Paradis. Le Prophète ﷺ a montré l’index et le majeur pour illustrer cette proximité.", "en": "The orphan’s guardian is the one who looks after him: expenses, upbringing, care. He has a rank close to the Prophet ﷺ in Paradise. The Prophet ﷺ pointed with his index and middle fingers to show how close."}}, {"t": "«كَافِلُ الْيَتِيمِ لَهُ أَوْ لِغَيْرِهِ أَنَا وَهُوَ كَهَاتَيْنِ فِي الْجَنَّةِ»", "s": "رواه مسلم (كتاب الزهد والرقائق). عن أبي هريرة رضي الله عنه.", "k": "muslim", "who": {"fr": "Abu Hurayra", "en": "Abu Hurayrah"}, "m": {"ar": "معنى «له أو لغيره»: أن يكون اليتيمُ قريبًا له أو أجنبيًّا عنه، فالأجر ثابتٌ في الحالين.", "fr": "Le sens de « pour lui ou pour un autre » : l’orphelin peut être un proche ou un étranger, la récompense est établie dans les deux cas.", "en": "The meaning of “for himself or for another”: the orphan may be a relative or a stranger; the reward holds in both cases."}}], "steps": {"ar": ["ساهم في كفالة يتيمٍ عبر جهةٍ موثوقةٍ ومرخَّصة.", "ساعد في مصاريف دراسة يتيمٍ تعرفه أو علاجه.", "عامل اليتيم بلطفٍ وأكرمه في الأعياد والمناسبات.", "إن لم تستطع الكفالة فدُلَّ عليها من يستطيع وادعُ لهم."], "fr": ["Contribuez à la prise en charge d’un orphelin par un organisme fiable et agréé.", "Aidez à payer les études ou les soins d’un orphelin que vous connaissez.", "Traitez l’orphelin avec douceur et honorez-le lors des fêtes.", "Si vous ne pouvez pas le prendre en charge, orientez quelqu’un qui le peut et invoquez pour eux."], "en": ["Contribute to sponsoring an orphan through a trustworthy, licensed organisation.", "Help pay for the schooling or treatment of an orphan you know.", "Treat the orphan gently and honour them on festivals and occasions.", "If you cannot sponsor, point someone who can to it and make du‘a for them."]}}, {"id": "islah", "ic": "<path d=\"M4 14l4-4 3 3 5-6 4 4M4 20h16\"/>", "ti": {"ar": "الإصلاح بين الناس", "fr": "Réconcilier les gens", "en": "Making peace between people"}, "sub": {"ar": "أن تُقرِّب قلبَين تباعدا", "fr": "Rapprocher deux cœurs qui se sont éloignés", "en": "Bringing two hearts back together"}, "aya": {"t": "إِنَّمَا ٱلۡمُؤۡمِنُونَ إِخۡوَةٞ فَأَصۡلِحُواْ بَيۡنَ أَخَوَيۡكُمۡۚ وَٱتَّقُواْ ٱللَّهَ لَعَلَّكُمۡ تُرۡحَمُونَ", "s": "سورة الحُجُرات، الآية 10"}, "had": [{"t": "«لَيْسَ الْكَذَّابُ الَّذِي يُصْلِحُ بَيْنَ النَّاسِ، فَيَنْمِي خَيْرًا، أَوْ يَقُولُ خَيْرًا»", "s": "متّفقٌ عليه — البخاري (كتاب الصلح) ، مسلم (كتاب البر والصلة والآداب). عن أمّ كلثوم بنت عقبة رضي الله عنها.", "k": "both", "who": {"fr": "Umm Kulthum bint ‘Uqba", "en": "Umm Kulthum bint ‘Uqbah"}, "m": {"ar": "من سعى للصلح بين الناس فنقل كلامًا طيّبًا أو قال خيرًا لتقريب القلوب فليس كذّابًا.", "fr": "Celui qui œuvre à la réconciliation en rapportant de bonnes paroles ou en disant du bien n’est pas un menteur.", "en": "One who works for reconciliation by passing on good words or saying something good is not a liar."}}, {"t": "«أَنَّ أَهْلَ، قُبَاءٍ اقْتَتَلُوا حَتَّى تَرَامَوْا بِالْحِجَارَةِ، فَأُخْبِرَ رَسُولُ اللَّهِ ﷺ بِذَلِكَ فَقَالَ اذْهَبُوا بِنَا نُصْلِحُ بَيْنَهُمْ»", "s": "رواه البخاري (كتاب الصلح). عن سهل بن سعد رضي الله عنه.", "k": "bukhari", "who": {"fr": "Sahl ibn Sa‘d", "en": "Sahl ibn Sa‘d"}, "m": {"ar": "سعى النبيُّ ﷺ بنفسه للإصلاح بين المتخاصمين.", "fr": "Le Prophète ﷺ a lui-même œuvré pour réconcilier des gens en conflit.", "en": "The Prophet ﷺ himself went to make peace between people in dispute."}}, {"t": "«كُلُّ سُلاَمَى مِنَ النَّاسِ عَلَيْهِ صَدَقَةٌ كُلَّ يَوْمٍ تَطْلُعُ فِيهِ الشَّمْسُ، يَعْدِلُ بَيْنَ الاِثْنَيْنِ صَدَقَةٌ»", "s": "رواه البخاري (كتاب الجهاد والسير). عن أبي هريرة رضي الله عنه.", "k": "bukhari", "who": {"fr": "Abu Hurayra", "en": "Abu Hurayrah"}, "m": {"ar": "مقتطفٌ من حديثٍ أطول عن أبواب الصدقة؛ والعدلُ بين اثنين، والإصلاحُ بينهما بالعدل، صدقة.", "fr": "Extrait d’un hadith plus long sur les portes de l’aumône ; être équitable entre deux personnes, ou les réconcilier avec justice, est une aumône.", "en": "An excerpt from a longer hadith about the doors of charity; being fair between two people, or reconciling them with justice, is charity."}}], "steps": {"ar": ["اجمع بين متخاصمَين بكلمةٍ طيّبةٍ لا تزيد الخلافَ اشتعالًا.", "لا تنقل كلامًا يُوغر الصدور، وانقل ما يقرّب.", "ابدأ أنت بالسلام والصلح إن كان بينك وبين أحدٍ خصومة.", "اطلب العدل بين الطرفين ولا تتحيّز."], "fr": ["Rapprochez deux personnes en conflit par une bonne parole qui n’attise pas la dispute.", "Ne rapportez pas ce qui envenime les cœurs ; rapportez ce qui rapproche.", "Si vous avez un différend avec quelqu’un, commencez vous-même par le salut et la réconciliation.", "Cherchez l’équité entre les deux parties sans prendre parti."], "en": ["Bring two people in conflict together with a kind word that does not inflame the dispute.", "Do not relay what poisons hearts; relay what brings them closer.", "If you are in a dispute with someone, begin with the greeting and reconciliation yourself.", "Seek fairness between both sides without taking sides."]}}]};
var $ = function(s){ return document.querySelector(s); };
var KEY = 'az_khayr';
function sget(k, d){ try{ var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }
function sset(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function dayKey(d){ d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

/* قراءةٌ فقط من إعدادات التطبيق: الخلفيّةُ واللغة */
var S = sget('az_settings', {}) || {};
var bg = (S.bg === 'white' || S.bg === 'dark') ? S.bg : 'sepia';
document.documentElement.setAttribute('data-bg', bg);
var lang = sget('az_khayr_lang', null) || S.lang || 'ar';
if (!DATA.ui[lang]) lang = 'ar';
var openId = null;

function prog(){ var p = sget(KEY, {}); return (p && typeof p === 'object') ? p : {}; }
function isDone(P, id, k){ return !!(P[id] && P[id][k]); }
function monthCount(P, id){ var m = dayKey().slice(0,7), n = 0; Object.keys(P[id] || {}).forEach(function(k){ if (k.slice(0,7) === m) n++; }); return n; }
function toggle(id){
  var P = prog(), k = dayKey(); P[id] = P[id] || {};
  if (P[id][k]) delete P[id][k]; else P[id][k] = 1;
  var ks = Object.keys(P[id]).sort(); while (ks.length > 400) delete P[id][ks.shift()];
  sset(KEY, P); render();
}

function sourceLine(h, L){
  if (lang === 'ar') return h.s;
  return L.by[h.k] + ' · ' + L.narrator + ': ' + h.who[lang];
}

function render(){
  var L = DATA.ui[lang], P = prog(), k = dayKey();
  document.documentElement.lang = lang; document.documentElement.dir = L.dir;
  document.title = L.title + ' — صلاتي';
  $('#h1').textContent = L.title; $('#sub').textContent = L.sub; $('#back-t').textContent = L.back; $('#foot').textContent = L.foot;
  document.querySelectorAll('.langs button').forEach(function(b){ b.classList.toggle('on', b.dataset.l === lang); });
  var n = DATA.doors.filter(function(d){ return isDone(P, d.id, k); }).length;
  var h = '<div class="prog"><div class="big">' + n + ' <small>' + L.of + ' ' + DATA.doors.length + '</small></div><div class="tx"><b>' + esc(L.today) + '</b>' + esc(L.doorsDone) + '</div><div class="dots" aria-hidden="true">' +
    DATA.doors.map(function(d){ return '<i class="' + (isDone(P, d.id, k) ? 'on' : '') + '"></i>'; }).join('') + '</div></div>';
  DATA.doors.forEach(function(d){
    var done = isDone(P, d.id, k), open = openId === d.id;
    h += '<article class="door' + (done ? ' done' : '') + (open ? ' open' : '') + '" id="d-' + d.id + '"><button type="button" data-id="' + d.id + '" aria-expanded="' + open + '">' +
      '<span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">' + d.ic + '</svg></span><span class="hd"><b>' + esc(d.ti[lang]) + '</b><span>' + esc(d.sub[lang]) + '</span></span>' +
      '<span class="tk" aria-hidden="true">' + (done ? '✓' : '') + '</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="' + (L.dir === 'rtl' ? 'M15 6l-6 6 6 6' : 'M9 6l6 6-6 6') + '"/></svg></button>';
    if (open){
      h += '<div class="body"><div class="sec">' + esc(L.verses) + '</div><div class="ex"><p class="q">' + esc(d.aya.t) + '</p><span class="ref">' + esc(d.aya.s) + '</span></div>' +
        '<div class="sec">' + esc(L.hadith) + '</div>' +
        d.had.map(function(x){ return '<div class="h"><p class="ht">' + esc(x.t) + '</p><p class="hs">' + esc(sourceLine(x, L)) + '</p><p class="hm"><b>' + esc(L.meaning) + ':</b> ' + esc(x.m[lang]) + '</p></div>'; }).join('') +
        '<div class="sec">' + esc(L.steps) + '</div><ul class="stp">' + d.steps[lang].map(function(s){ return '<li>' + esc(s) + '</li>'; }).join('') + '</ul><p class="note">' + esc(L.stepsNote) + '</p>' +
        '<div class="act"><button type="button" class="' + (done ? 'undo' : '') + '" data-do="' + d.id + '">' + esc(done ? L.undo : L.did) + '</button><span>' + monthCount(P, d.id) + ' ' + esc(L.month) + '</span></div></div>';
    }
    h += '</article>';
  });
  $('#main').innerHTML = h;
  $('#main').querySelectorAll('.door>button').forEach(function(b){ b.onclick = function(){ openId = (openId === b.dataset.id) ? null : b.dataset.id; render(); if (openId){ var el = $('#d-' + openId); if (el && el.scrollIntoView) el.scrollIntoView({block:'nearest'}); } }; });
  $('#main').querySelectorAll('[data-do]').forEach(function(b){ b.onclick = function(){ toggle(b.dataset['do']); }; });
}
document.querySelectorAll('.langs button').forEach(function(b){ b.onclick = function(){ lang = b.dataset.l; sset('az_khayr_lang', lang); render(); }; });
render();
})();
</script>
</body>
</html>
