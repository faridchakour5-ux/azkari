:root{
  --bg:#EFE6D4; --card:#F6EDDB; --text:#3A352E; --text-2:rgba(58,53,46,.62); --text-3:rgba(58,53,46,.34);
  --sep:rgba(58,53,46,.16); --line:rgba(58,53,46,.09); --fill:rgba(120,105,80,.12);
  --accent:#0B5742; --accent-2:#08463A; --accent-bg:rgba(11,87,66,.10); --gold:#A8741A; --gold-bg:rgba(168,116,26,.12);
  --ink:#063D30; --qtext:#0A5441;
  --shadow:0 1px 2px rgba(58,53,46,.05), 0 4px 14px rgba(58,53,46,.06);
}
:root[data-bg="white"]{ --bg:#F2F2F7; --card:#FAFAF8; --text:#2B2B2B; --text-2:rgba(43,43,43,.6); --text-3:rgba(43,43,43,.32); --sep:rgba(43,43,43,.16); --line:rgba(43,43,43,.08); --fill:rgba(120,120,128,.1); }
:root[data-bg="dark"]{ --bg:#121212; --card:#1E1E1E; --text:#E6E1D6; --text-2:rgba(230,225,214,.62); --text-3:rgba(230,225,214,.32); --sep:rgba(230,225,214,.14); --line:rgba(255,255,255,.07); --fill:rgba(200,200,200,.08);
  --accent:#34C77B; --accent-2:#2BAA68; --accent-bg:rgba(52,199,123,.16); --gold:#E3B25A; --gold-bg:rgba(227,178,90,.14); --ink:#CDEFE0; --qtext:#4CC79B;
  --shadow:0 1px 3px rgba(0,0,0,.45), 0 5px 16px rgba(0,0,0,.35); }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--text); font-family:'PlexAr',system-ui,sans-serif; line-height:1.85; -webkit-font-smoothing:antialiased; padding-bottom:calc(36px + env(safe-area-inset-bottom,0px));}
a{color:var(--accent);}
.hero{position:relative; overflow:hidden; color:#fff; padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 26px; background:linear-gradient(160deg,#0E6B52 0%,#0A5441 48%,#063D30 100%);}
.hero::before{content:''; position:absolute; inset-inline-end:0; top:-30px; width:300px; height:300px; background:url(icons/drawer-zellige.png) no-repeat center/contain; pointer-events:none;}
[dir=rtl] .hero::before{transform:scaleX(-1);}
.hero::after{content:''; position:absolute; inset-inline:0; bottom:0; height:2px; background:linear-gradient(90deg,transparent,#D9B15C 30%,#D9B15C 70%,transparent);}
.hero-top{position:relative; display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:18px;}
.playlogo{vertical-align:-2px; margin-inline-start:5px; flex:0 0 auto;}
.back{display:inline-flex; align-items:center; gap:6px; flex:0 0 auto; white-space:nowrap; color:#fff; text-decoration:none; font-weight:600; font-size:13.5px; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,.12);}
.back svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
[dir=ltr] .back svg{transform:scaleX(-1);}
.langs{display:flex; gap:4px; background:rgba(255,255,255,.12); padding:3px; border-radius:999px; direction:ltr;}
.langs button{border:0; background:transparent; color:#fff; font:inherit; font-size:12.5px; font-weight:600; padding:5px 9px; border-radius:999px; cursor:pointer;}
.langs button.on{background:#fff; color:#063D30;}
.hero h1{position:relative; margin:0 0 6px; font-size:clamp(26px,7.4vw,34px); line-height:1.35; font-weight:800; color:#fff;}
.hero p{position:relative; margin:0; font-size:14.5px; color:rgba(255,255,255,.86); font-weight:500; max-width:34em;}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
main{max-width:720px; margin:0 auto; padding:14px max(10px,env(safe-area-inset-left)) 0;}
.prog{display:flex; align-items:center; flex-wrap:wrap; gap:10px 14px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px 16px; box-shadow:var(--shadow); margin-bottom:12px;}
.prog .big{font-size:30px; font-weight:800; color:var(--accent); line-height:1;} .prog .big small{font-size:14px; color:var(--text-2); font-weight:600;}
.prog .tx{font-size:13.5px; color:var(--text-2); line-height:1.5;} .prog .tx b{display:block; font-size:15px; color:var(--ink);}
.dots{display:flex; flex-wrap:wrap; gap:6px; flex:1 1 100%;} .dots i{width:14px; height:14px; border-radius:50%; background:var(--fill); border:1.5px solid var(--sep);} .dots i.on{background:var(--accent); border-color:var(--accent);}
.door{background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); margin:0 0 10px; overflow:hidden;}
.door>button{all:unset; box-sizing:border-box; width:100%; display:flex; align-items:center; gap:12px; padding:14px 14px; cursor:pointer;}
.door .ic{flex:0 0 46px; height:46px; border-radius:15px; background:var(--accent-bg); color:var(--accent); display:flex; align-items:center; justify-content:center;}
.door .ic svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
.door .hd{flex:1; min-width:0;} .door .hd b{display:block; font-size:17px; color:var(--ink); line-height:1.4; font-weight:800;} .door .hd span{display:block; font-size:13px; color:var(--text-2); line-height:1.55; margin-top:2px;}
.door .tk{flex:0 0 auto; width:26px; height:26px; border-radius:50%; border:2px solid var(--sep); display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; font-weight:800;}
.door.done .tk{background:var(--accent); border-color:var(--accent);}
.door .chev{flex:0 0 auto; width:18px; height:18px; fill:none; stroke:var(--text-3); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; transition:transform .2s;}
.door.open .chev{transform:rotate(90deg);}
.door .body{display:none; padding:0 14px 16px; border-top:1px solid var(--line);} .door.open .body{display:block;}
.sec{margin:14px 0 4px; font-size:13.5px; font-weight:800; color:var(--gold); letter-spacing:.2px;}
.q{font-family:'AmiriQuran','Amiri',serif; font-size:clamp(25px,6.8vw,29px); line-height:2.4; color:var(--qtext); text-align:center; direction:rtl; margin:0; word-spacing:2px; -webkit-text-stroke:.014em currentColor;}
.ref{display:block; text-align:center; font-size:12.5px; color:var(--text-3); font-weight:600; direction:rtl;}
.ex{padding:6px 12px 10px; border-radius:16px; background:var(--fill); border:1px solid var(--line);}
.h{margin:8px 0; padding:10px 12px; border-radius:16px; background:var(--fill); border:1px solid var(--line); border-inline-start:4px solid var(--accent);}
.ht{margin:0; font-size:17px; line-height:2.1; color:var(--ink); direction:rtl; text-align:start; font-weight:500;}
[dir=ltr] .ht{text-align:right;}
.hs{margin:6px 0 0; font-size:12.5px; color:var(--text-3); line-height:1.7; font-weight:600;}
.hm{margin:8px 0 0; padding:8px 10px; font-size:14px; line-height:1.85; color:var(--text-2); background:var(--gold-bg); border-radius:12px;}
.hm b{color:var(--gold);}
.stp{margin:4px 0 2px; padding-inline-start:22px;} .stp li{margin:6px 0; font-size:15px; color:var(--ink);}
.note{margin:6px 0 0; font-size:12.5px; color:var(--text-3);}
.act{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px;}
.act button{border:0; font:inherit; font-size:15px; font-weight:800; padding:11px 20px; border-radius:999px; cursor:pointer; min-height:44px; background:var(--accent); color:#fff;}
.act button.undo{background:var(--fill); color:var(--text-2);}
.act span{font-size:13px; color:var(--text-2);}
.qrf{margin:14px 14px 0; text-align:center; color:var(--text-3); font-size:12.5px;} .qrf .qrb{display:block; margin:10px auto 0; width:92px;} .qrf .qrb svg{display:block; width:92px; height:92px; border-radius:10px; border:1px solid var(--sep);}
.foot{margin:22px 14px 0; text-align:center; color:var(--text-3); font-size:12.5px; line-height:1.8;}
</style>

id": "rahim", "ic": "<circle cx=\"8\" cy=\"8\" r=\"3\"/><circle cx=\"17\" cy=\"9\" r=\"2.5\"/><path d=\"M2.5 20c.6-3.4 3-5 5.5-5s4.9 1.6 5.5 5M15 15.4c3 0 5 1.4 6 4.6\"/>", "ti": {"ar": "صلة الرحم", "fr": "Les liens de parenté", "en": "Keeping family ties"}, "sub": {"ar": "سببٌ للبركة في الرزق والعمر", "fr": "Cause de bénédiction dans la subsistance et la vie", "en": "A cause of blessing in provision and life"}, "aya": {"t": "وَٱلَّذِينَ يَصِلُونَ مَآ أَمَرَ ٱللَّهُ بِهِۦٓ أَن يُوصَلَ وَيَخۡشَوۡنَ رَبَّهُمۡ وَيَخَافُونَ سُوٓءَ ٱلۡحِسَابِ", "s": "سورة الرّعد، الآية 21"}, "had": [{"t": "«مَنْ أَحَبَّ أَنْ يُبْسَطَ لَهُ فِي رِزْقِهِ، وَيُنْسَأَ لَهُ فِي أَثَرِهِ، فَلْيَصِلْ رَحِمَهُ»", "s": "متّفقٌ عليه — البخاري (كتاب الأدب) ، مسلم (كتاب البر والصلة والآداب). عن أنس بن مالك رضي الله عنه.", "k": "both", "who": {"fr": "Anas ibn Malik", "en": "Anas ibn Malik"}, "m": {"ar": "صلةُ الرحم سببٌ للبركة في الرزق وفي العمر بإذن الله.", "fr": "Maintenir les liens de parenté est une cause de bénédiction dans la subsistance et dans la vie, par la permission d’Allah.", "en": "Keeping family ties is a cause of blessing in provision and in life, by Allah’s permission."}}, {"t": "«لاَ يَدْخُلُ الْجَنَّةَ قَاطِعٌ»", "s": "متّفقٌ عليه — البخاري (كتاب الأدب) ، مسلم (كتاب البر والصلة والآداب). عن جبير بن مطعم رضي الله عنه.", "k": "both", "who": {"fr": "Jubayr ibn Mut‘im", "en": "Jubayr ibn Mut‘im"}, "m": {"ar": "تحذيرٌ شديد من قطع الرحم. وللعلماء توجيهاتٌ في معنى هذا الوعيد، لكنّ المقصودَ أنّ القطيعة ذنبٌ عظيم.", "fr": "Mise en garde sévère contre la rupture des liens. Les savants ont des explications sur le sens de cette menace, mais l’essentiel est que la rupture est un grand péché.", "en": "A severe warning against cutting family ties. Scholars have explanations of this threat, but the point is that cutting ties is a grave sin."}}], "steps": {"ar": ["اتصل بقريبٍ لم تسأل عنه منذ مدّة.", "أرسل رسالةَ سلامٍ أو دعاءٍ إلى قريبٍ بعيد.", "زُر مريضًا أو كبيرًا من أهلك.", "سامِح قريبًا أخطأ في حقّك وابدأ بالسلام."], "fr": ["Appelez un proche dont vous n’avez pas pris de nouvelles depuis longtemps.", "Envoyez un message de salutations ou une invocation à un proche éloigné.", "Rendez visite à un malade ou à une personne âgée de votre famille.", "Pardonnez à un proche qui vous a lésé et commencez par le salut."], "en": ["Call a relative you have not asked after for a while.", "Send a greeting or a du‘a to a distant relative.", "Visit a sick or elderly family member.", "Forgive a relative who wronged you and begin with the greeting of peace."]}}, {"id": "jar", "ic": "<path d=\"M3 11l9-7 9 7v9H3zM9 20v-6h6v6\"/>", "ti": {"ar": "الإحسان إلى الجار", "fr": "Bien traiter le voisin", "en": "Being good to the neighbour"}, "sub": {"ar": "أوصى به جبريل حتى ظنّ النبيُّ ﷺ أنه سيُورِّثه", "fr": "Jibrîl l’a tant recommandé que le Prophète ﷺ a cru qu’il hériterait", "en": "Jibril kept urging it until the Prophet ﷺ thought the neighbour would inherit"}, "aya": {"t": "۞ وَٱعۡبُدُواْ ٱللَّهَ وَلَا تُشۡرِكُواْ بِهِۦ شَيۡـٔٗاۖ وَبِٱلۡوَٰلِدَيۡنِ إِحۡسَٰنٗا وَبِذِي ٱلۡقُرۡبَىٰ وَٱلۡيَتَٰمَىٰ وَٱلۡمَسَٰكِينِ وَٱلۡجَارِ ذِي ٱلۡقُرۡبَىٰ وَٱلۡجَارِ ٱلۡجُنُبِ وَٱلصَّاحِبِ بِٱلۡجَنۢبِ وَٱبۡنِ ٱلسَّبِيلِ وَمَا مَلَكَتۡ أَيۡمَٰنُكُمۡۗ إِنَّ ٱللَّهَ لَا يُحِبُّ مَن كَانَ مُخۡتَالٗا فَخُورًا", "s": "سورة النّساء، الآية 36"}, "had": [{"t": "«مَا زَالَ جِبْرِيلُ يُوصِينِي بِالْجَارِ حَتَّى ظَنَنْتُ أَنَّهُ سَيُوَرِّثُهُ»", "s": "متّفقٌ عليه — البخاري (كتاب الأدب) ، مسلم (كتاب البر والصلة والآداب). عن عبد الله بن عمر رضي الله عنهما.", "k": "both", "who": {"fr": "Ibn ‘Umar", "en": "Ibn ‘Umar"}, "m": {"ar": "مبالغةٌ في بيان عِظَم حقّ الجار.", "fr": "Une insistance sur l’importance du droit du voisin.", "en": "An emphasis on how great the neighbour’s right is."}}, {"t": "«يَا نِسَاءَ الْمُسْلِمَاتِ لاَ تَحْقِرَنَّ جَارَةٌ لِجَارَتِهَا، وَلَوْ فِرْسِنَ شَاةٍ»", "s": "متّفقٌ عليه — البخاري (كتاب الهبة وفضلها والتحريض عليها · كتاب الأدب) ، مسلم (كتاب الزكاة). عن أبي هريرة رضي الله عنه.", "k": "both", "who": {"fr": "Abu Hurayra", "en": "Abu Hurayrah"}, "m": {"ar": "لا تستقلّ ما تُهديه لجارك ولو كان يسيرًا (فِرْسِن الشاة: ظِلْفُها).", "fr": "Ne minimisez pas ce que vous offrez à votre voisin, même si c’est peu (le sabot d’un mouton).", "en": "Do not belittle what you give your neighbour, however little (a sheep’s trotter)."}}, {"t": "«يَا أَبَا ذَرٍّ إِذَا طَبَخْتَ مَرَقَةً فَأَكْثِرْ مَاءَهَا وَتَعَاهَدْ جِيرَانَكَ»", "s": "رواه مسلم (كتاب البر والصلة والآداب). عن أبي ذر رضي الله عنه.", "k": "muslim", "who": {"fr": "Abu Dharr", "en": "Abu Dharr"}, "m": {"ar": "توجيهٌ إلى مشاركة الجيران بشيءٍ من الطعام كلّما تيسّر.", "fr": "Une orientation à partager avec les voisins un peu de nourriture chaque fois que c’est possible.", "en": "Guidance to share some food with the neighbours whenever possible."}}], "steps": {"ar": ["سلِّم على جارك وابتسم له.", "أهدِ جارَك شيئًا بسيطًا من طعامك.", "اسأل عن جارٍ مريضٍ أو كبيرٍ في السنّ.", "تجنّب كلَّ ما يؤذي جارك: الضجيج، وسدَّ الطريق، والكلامَ السيّئ."], "fr": ["Saluez votre voisin avec un sourire.", "Offrez-lui un peu de votre repas.", "Prenez des nouvelles d’un voisin malade ou âgé.", "Évitez tout ce qui le dérange : le bruit, l’obstruction du passage, les mauvaises paroles."], "en": ["Greet your neighbour with a smile.", "Share a little of your food with them.", "Check on a sick or elderly neighbour.", "Avoid whatever bothers them: noise, blocking the way, unkind words."]}}, {"id": "yatim", "ic": "<circle cx=\"12\" cy=\"7\" r=\"3\"/><path d=\"M5 21c0-4.4 3-7 7-7s7 2.6 7 7\"/>", "ti": {"ar": "كفالة اليتيم", "fr": "Prendre en charge un orphelin", "en": "Caring for an orphan"}, "sub": {"ar": "قربٌ من النبيّ ﷺ في الجنة", "fr": "Une proximité avec le Prophète ﷺ au Paradis", "en": "Nearness to the Prophet ﷺ in Paradise"}, "aya": {"t": "فَأَمَّا ٱلۡيَتِيمَ فَلَا تَقۡهَرۡ وَأَمَّا ٱلسَّآئِلَ فَلَا تَنۡهَرۡ", "s": "سورة الضُّحى، الآيات ⁦9–10⁩"}, "had": [{"t": "«أَنَا وَكَافِلُ الْيَتِيمِ فِي الْجَنَّةِ هَكَذَا»", "s": "رواه البخاري (كتاب الطلاق · كتاب الأدب). عن سهل بن سعد رضي الله عنه.", "k": "bukhari", "who": {"fr": "Sahl ibn Sa‘d", "en": "Sahl ibn Sa‘d"}, "m": {"ar": "كافلُ اليتيم هو القائم بأمره من نفقةٍ وتربيةٍ ورعاية، وله منزلةٌ قريبة من النبيّ ﷺ في الجنة. وأشار ﷺ بالسبابة والوسطى مبيّنًا قربَهما.", "fr": "Le tuteur de l’orphelin est celui qui s’occupe de lui : dépenses, éducation, soin. Il a un rang proche du Prophète ﷺ au Paradis. Le Prophète ﷺ a montré l’index et le majeur pour illustrer cette proximité.", "en": "The orphan’s guardian is the one who looks after him: expenses, upbringing, care. He has a rank close to the Prophet ﷺ in Paradise. The Prophet ﷺ pointed with his index and middle fingers to show how close."}}, {"t": "«كَافِلُ الْيَتِيمِ لَهُ أَوْ لِغَيْرِهِ أَنَا وَهُوَ كَهَاتَيْنِ فِي الْجَنَّةِ»", "s": "رواه مسلم (كتاب الزهد والرقائق). عن أبي هريرة رضي الله عنه.", "k": "muslim", "who": {"fr": "Abu Hurayra", "en": "Abu Hurayrah"}, "m": {"ar": "معنى «له أو لغيره»: أن يكون اليتيمُ قريبًا له أو أجنبيًّا عنه، فالأجر ثابتٌ في الحالين.", "fr": "Le sens de « pour lui ou pour un autre » : l’orphelin peut être un proche ou un étranger, la récompense est établie dans les deux cas.", "en": "The meaning of “for himself or for another”: the orphan may be a relative or a stranger; the reward holds in both cases."}}], "steps": {"ar": ["ساهم في كفالة يتيمٍ عبر جهةٍ موثوقةٍ ومرخَّصة.", "ساعد في مصاريف دراسة يتيمٍ تعرفه أو علاجه.", "عامل اليتيم بلطفٍ وأكرمه في الأعياد والمناسبات.", "إن لم تستطع الكفالة فدُلَّ عليها من يستطيع وادعُ لهم."], "fr": ["Contribuez à la prise en charge d’un orphelin par un organisme fiable et agréé.", "Aidez à payer les études ou les soins d’un orphelin que vous connaissez.", "Traitez l’orphelin avec douceur et honorez-le lors des fêtes.", "Si vous ne pouvez pas le prendre en charge, orientez quelqu’un qui le peut et invoquez pour eux."], "en": ["Contribute to sponsoring an orphan through a trustworthy, licensed organisation.", "Help pay for the schooling or treatment of an orphan you know.", "Treat the orphan gently and honour them on festivals and occasions.", "If you cannot sponsor, point someone who can to it and make du‘a for them."]}}, {"id": "islah", "ic": "<path d=\"M4 14l4-4 3 3 5-6 4 4M4 20h16\"/>", "ti": {"ar": "الإصلاح بين الناس", "fr": "Réconcilier les gens", "en": "Making peace between people"}, "sub": {"ar": "أن تُقرِّب قلبَين تباعدا", "fr": "Rapprocher deux cœurs qui se sont éloignés", "en": "Bringing two hearts back together"}, "aya": {"t": "إِنَّمَا ٱلۡمُؤۡمِنُونَ إِخۡوَةٞ فَأَصۡلِحُواْ بَيۡنَ أَخَوَيۡكُمۡۚ وَٱتَّقُواْ ٱللَّهَ لَعَلَّكُمۡ تُرۡحَمُونَ", "s": "سورة الحُجُرات، الآية 10"}, "had": [{"t": "«لَيْسَ الْكَذَّابُ الَّذِي يُصْلِحُ بَيْنَ النَّاسِ، فَيَنْمِي خَيْرًا، أَوْ يَقُولُ خَيْرًا»", "s": "متّفقٌ عليه — البخاري (كتاب الصلح) ، مسلم (كتاب البر والصلة والآداب). عن أمّ كلثوم بنت عقبة رضي الله عنها.", "k": "both", "who": {"fr": "Umm Kulthum bint ‘Uqba", "en": "Umm Kulthum bint ‘Uqbah"}, "m": {"ar": "من سعى للصلح بين الناس فنقل كلامًا طيّبًا أو قال خيرًا لتقريب القلوب فليس كذّابًا.", "fr": "Celui qui œuvre à la réconciliation en rapportant de bonnes paroles ou en disant du bien n’est pas un menteur.", "en": "One who works for reconciliation by passing on good words or saying something good is not a liar."}}, {"t": "«أَنَّ أَهْلَ، قُبَاءٍ اقْتَتَلُوا حَتَّى تَرَامَوْا بِالْحِجَارَةِ، فَأُخْبِرَ رَسُولُ اللَّهِ ﷺ بِذَلِكَ فَقَالَ اذْهَبُوا بِنَا نُصْلِحُ بَيْنَهُمْ»", "s": "رواه البخاري (كتاب الصلح). عن سهل بن سعد رضي الله عنه.", "k": "bukhari", "who": {"fr": "Sahl ibn Sa‘d", "en": "Sahl ibn Sa‘d"}, "m": {"ar": "سعى النبيُّ ﷺ بنفسه للإصلاح بين المتخاصمين.", "fr": "Le Prophète ﷺ a lui-même œuvré pour réconcilier des gens en conflit.", "en": "The Prophet ﷺ himself went to make peace between people in dispute."}}, {"t": "«كُلُّ سُلاَمَى مِنَ النَّاسِ عَلَيْهِ صَدَقَةٌ كُلَّ يَوْمٍ تَطْلُعُ فِيهِ الشَّمْسُ، يَعْدِلُ بَيْنَ الاِثْنَيْنِ صَدَقَةٌ»", "s": "رواه البخاري (كتاب الجهاد والسير). عن أبي هريرة رضي الله عنه.", "k": "bukhari", "who": {"fr": "Abu Hurayra", "en": "Abu Hurayrah"}, "m": {"ar": "مقتطفٌ من حديثٍ أطول عن أبواب الصدقة؛ والعدلُ بين اثنين، والإصلاحُ بينهما بالعدل، صدقة.", "fr": "Extrait d’un hadith plus long sur les portes de l’aumône ; être équitable entre deux personnes, ou les réconcilier avec justice, est une aumône.", "en": "An excerpt from a longer hadith about the doors of charity; being fair between two people, or reconciling them with justice, is charity."}}], "steps": {"ar": ["اجمع بين متخاصمَين بكلمةٍ طيّبةٍ لا تزيد الخلافَ اشتعالًا.", "لا تنقل كلامًا يُوغر الصدور، وانقل ما يقرّب.", "ابدأ أنت بالسلام والصلح إن كان بينك وبين أحدٍ خصومة.", "اطلب العدل بين الطرفين ولا تتحيّز."], "fr": ["Rapprochez deux personnes en conflit par une bonne parole qui n’attise pas la dispute.", "Ne rapportez pas ce qui envenime les cœurs ; rapportez ce qui rapproche.", "Si vous avez un différend avec quelqu’un, commencez vous-même par le salut et la réconciliation.", "Cherchez l’équité entre les deux parties sans prendre parti."], "en": ["Bring two people in conflict together with a kind word that does not inflame the dispute.", "Do not relay what poisons hearts; relay what brings them closer.", "If you are in a dispute with someone, begin with the greeting and reconciliation yourself.", "Seek fairness between both sides without taking sides."]}}, {"id": "adha", "ic": "<path d=\"M4 20l8-16 8 16M8.5 13h7\"/>", "ti": {"ar": "إماطة الأذى عن الطريق", "fr": "Écarter ce qui nuit sur le chemin", "en": "Removing harm from the road"}, "sub": {"ar": "عملٌ يسير، أدنى شُعَب الإيمان", "fr": "Un geste simple, la plus modeste branche de la foi", "en": "A simple deed, the humblest branch of faith"}, "aya": {"t": "فَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٍ خَيۡرٗا يَرَهُۥ وَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٖ شَرّٗا يَرَهُۥ", "s": "سورة الزّلزلة، الآيات ⁦7–8⁩"}, "had": [{"t": "«الإِيمَانُ بِضْعٌ وَسَبْعُونَ أَوْ بِضْعٌ وَسِتُّونَ شُعْبَةً فَأَفْضَلُهَا قَوْلُ لاَ إِلَهَ إِلاَّ اللَّهُ وَأَدْنَاهَا إِمَاطَةُ الأَذَى عَنِ الطَّرِيقِ وَالْحَيَاءُ شُعْبَةٌ مِنَ الإِيمَانِ»", "s": "رواه مسلم (كتاب الإيمان). عن أبي هريرة رضي الله عنه.", "k": "muslim", "who": {"fr": "Abu Hurayra", "en": "Abu Hurayrah"}, "m": {"ar": "من شُعَب الإيمان الكثيرة: أعلاها كلمةُ التوحيد، وأدناها إزالةُ ما يؤذي الناسَ من الطريق.", "fr": "Parmi les nombreuses branches de la foi : la plus haute est la parole du tawhid, la plus modeste est d’écarter du chemin ce qui nuit aux gens.", "en": "Among the many branches of faith: the highest is the word of tawhid, the humblest is removing from the road whatever harms people."}}, {"t": "«مَرَّ رَجُلٌ بِغُصْنِ شَجَرَةٍ عَلَى ظَهْرِ طَرِيقٍ فَقَالَ وَاللَّهِ لأُنَحِّيَنَّ هَذَا عَنِ الْمُسْلِمِينَ لاَ يُؤْذِيهِمْ. فَأُدْخِلَ الْجَنَّةَ»", "s": "رواه مسلم (كتاب البر والصلة والآداب). عن أبي هريرة رضي الله عنه.", "k": "muslim", "who": {"fr": "Abu Hurayra", "en": "Abu Hurayrah"}, "m": {"ar": "رجلٌ أزاح غصنًا يؤذي المسلمين عن الطريق فكان ذلك سببًا لدخوله الجنة.", "fr": "Un homme a écarté du chemin une branche qui gênait les musulmans, et cela fut une cause de son entrée au Paradis.", "en": "A man moved a branch off the road that was harming Muslims, and that became a cause of his entering Paradise."}}, {"t": "«بَيْنَمَا رَجُلٌ يَمْشِي بِطَرِيقٍ وَجَدَ غُصْنَ شَوْكٍ عَلَى الطَّرِيقِ فَأَخَّرَهُ، فَشَكَرَ اللَّهُ لَهُ، فَغَفَرَ لَهُ»", "s": "رواه البخاري (كتاب الأذان · كتاب المظالم). عن أبي هريرة رضي الله عنه.", "k": "bukhari", "who": {"fr": "Abu Hurayra", "en": "Abu Hurayrah"}, "m": {"ar": "إزالةُ الشوك من الطريق عملٌ يسير، شكر الله لصاحبه وغفر له.", "fr": "Écarter une épine du chemin est un geste simple ; Allah en a remercié l’homme et lui a pardonné.", "en": "Removing a thorn from the road is a simple deed; Allah thanked the man for it and forgave him."}}], "steps": {"ar": ["ارفع من طريقك اليوم حجرًا أو قشرةً أو زجاجًا قد يؤذي المارّة.", "ضع النفاياتَ في مكانها ولا ترمِها في الشارع.", "نبّه برفق على ما قد يؤذي الناس (حفرةٌ، سلكٌ مكشوف).", "افسح الطريق لغيرك في الممرّات الضيّقة."], "fr": ["Retirez aujourd’hui de votre chemin une pierre, une écorce ou du verre qui pourrait blesser les passants.", "Jetez vos déchets à leur place, pas dans la rue.", "Signalez avec douceur ce qui peut blesser (un trou, un fil dénudé).", "Laissez la place aux autres dans les passages étroits."], "en": ["Pick up a stone, peel or glass from your path today that could hurt passers-by.", "Put litter where it belongs, not in the street.", "Gently warn about what could hurt people (a hole, a bare wire).", "Make way for others in narrow passages."]}}, {"id": "hajat", "ic": "<path d=\"M3 14h4l3 3h4a2 2 0 0 0 0-4H11M7 14V8l5-3 5 3v2\"/>", "ti": {"ar": "قضاء الحوائج وتفريج الكرب", "fr": "Répondre aux besoins et soulager les peines", "en": "Meeting needs and easing hardship"}, "sub": {"ar": "والله في عون العبد ما كان العبد في عون أخيه", "fr": "Allah aide le serviteur tant qu’il aide son frère", "en": "Allah helps His servant as long as he helps his brother"}, "aya": {"t": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱرۡكَعُواْ وَٱسۡجُدُواْۤ وَٱعۡبُدُواْ رَبَّكُمۡ وَٱفۡعَلُواْ ٱلۡخَيۡرَ لَعَلَّكُمۡ تُفۡلِحُونَ۩", "s": "سورة الحج، الآية 77"}, "had": [{"t": "«الْمُسْلِمُ أَخُو الْمُسْلِمِ، لاَ يَظْلِمُهُ وَلاَ يُسْلِمُهُ، وَمَنْ كَانَ فِي حَاجَةِ أَخِيهِ كَانَ اللَّهُ فِي حَاجَتِهِ، وَمَنْ فَرَّجَ عَنْ مُسْلِمٍ كُرْبَةً فَرَّجَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرُبَاتِ يَوْمِ الْقِيَامَةِ، وَمَنْ سَتَرَ مُسْلِمًا سَتَرَهُ اللَّهُ يَوْمَ الْقِيَامَةِ»", "s": "رواه البخاري (كتاب المظالم · كتاب الإكراه). عن عبد الله بن عمر رضي الله عنهما.", "k": "bukhari", "who": {"fr": "Ibn ‘Umar", "en": "Ibn ‘Umar"}, "m": {"ar": "من سعى في قضاء حاجة أخيه كان الله في حاجته، ومن فرّج عن مسلمٍ كربة فرّج الله عنه كربةً من كُرَب يوم القيامة، ومن ستر مسلمًا ستره الله.", "fr": "Celui qui répond au besoin de son frère, Allah répond à son besoin ; celui qui soulage un musulman d’une peine, Allah le soulagera d’une peine du Jour de la Résurrection ; celui qui couvre un musulman, Allah le couvrira.", "en": "Whoever meets his brother’s need, Allah meets his need; whoever relieves a Muslim of a hardship, Allah relieves him of a hardship on the Day of Resurrection; whoever covers a Muslim, Allah will cover him."}}, {"t": "«مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا نَفَّسَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ وَمَنْ يَسَّرَ عَلَى مُعْسِرٍ يَسَّرَ اللَّهُ عَلَيْهِ فِي الدُّنْيَا وَالآخِرَةِ وَمَنْ سَتَرَ مُسْلِمًا سَتَرَهُ اللَّهُ فِي الدُّنْيَا وَالآخِرَةِ وَاللَّهُ فِي عَوْنِ الْعَبْدِ مَا كَانَ الْعَبْدُ فِي عَوْنِ أَخِيهِ»", "s": "رواه مسلم (كتاب الذكر والدعاء والتوبة والاستغفار). عن أبي هريرة رضي الله عنه.", "k": "muslim", "who": {"fr": "Abu Hurayra", "en": "Abu Hurayrah"}, "m": {"ar": "الجزاء من جنس العمل: من يسّر لأخيه وفرّج عنه أعانه الله في الدنيا والآخرة.", "fr": "La récompense est de même nature que l’acte : qui facilite et soulage son frère, Allah l’aide dans ce monde et dans l’autre.", "en": "The reward matches the deed: whoever eases and relieves his brother, Allah helps him in this world and the next."}}, {"t": "«كُلُّ مَعْرُوفٍ صَدَقَةٌ»", "s": "رواه البخاري (كتاب الأدب). عن جابر بن عبد الله رضي الله عنهما.", "k": "bukhari", "who": {"fr": "Jabir ibn ‘Abdillah", "en": "Jabir ibn ‘Abdillah"}, "m": {"ar": "كلُّ عملٍ طيّبٍ تُقدّمه للناس صدقة، ولو كان بسيطًا.", "fr": "Tout bienfait que vous faites aux gens est une aumône, même simple.", "en": "Every good deed you do for people is charity, however simple."}}], "steps": {"ar": ["اسأل نفسك: من في محيطي يحتاج مساعدةً صغيرة اليوم؟", "ساعد شخصًا في حملٍ أو توصيلٍ أو معاملةٍ لا يحسنها.", "فرّج عن مدينٍ أو مكروبٍ بكلمةٍ أو بمبلغٍ ميسور أو بمهلة.", "استر عيب أخيك ولا تُشِعه."], "fr": ["Demandez-vous : qui, autour de moi, a besoin d’une petite aide aujourd’hui ?", "Aidez quelqu’un à porter, à transporter ou à faire une démarche qu’il maîtrise mal.", "Soulagez un débiteur ou une personne en difficulté par un mot, une petite somme ou un délai.", "Couvrez le défaut de votre frère et ne le divulguez pas."], "en": ["Ask yourself: who around me needs a little help today?", "Help someone carry, transport or handle paperwork they struggle with.", "Ease a debtor or someone in hardship with a word, a small sum or extra time.", "Cover your brother’s fault and do not spread it."]}}, {"id": "kalima", "ic": "<path d=\"M4 5h16v11H9l-5 4z\"/><path d=\"M8.5 10h.01M12 10h.01M15.5 10h.01\"/>", "ti": {"ar": "الكلمة الطيّبة وبشاشة الوجه", "fr": "La bonne parole et le visage souriant", "en": "A kind word and a cheerful face"}, "sub": {"ar": "صدقةٌ لا تكلّفك مالًا", "fr": "Une aumône qui ne vous coûte rien", "en": "Charity that costs you nothing"}, "aya": {"t": "أَلَمۡ تَرَ كَيۡفَ ضَرَبَ ٱللَّهُ مَثَلٗا كَلِمَةٗ طَيِّبَةٗ كَشَجَرَةٖ طَيِّبَةٍ أَصۡلُهَا ثَابِتٞ وَفَرۡعُهَا فِي ٱلسَّمَآءِ تُؤۡتِيٓ أُكُلَهَا كُلَّ حِينِۭ بِإِذۡنِ رَبِّهَاۗ وَيَضۡرِبُ ٱللَّهُ ٱلۡأَمۡثَالَ لِلنَّاسِ لَعَلَّهُمۡ يَتَذَكَّرُونَ", "s": "سورة إبراهيم، الآيات ⁦24–25⁩"}, "had": [{"t": "«لاَ تَحْقِرَنَّ مِنَ الْمَعْرُوفِ شَيْئًا وَلَوْ أَنْ تَلْقَى أَخَاكَ بِوَجْهٍ طَلْقٍ»", "s": "رواه مسلم (كتاب البر والصلة والآداب). عن أبي ذر رضي الله عنه.", "k": "muslim", "who": {"fr": "Abu Dharr", "en": "Abu Dharr"}, "m": {"ar": "لا تستصغر شيئًا من الخير، ولو كان لقاءُ أخيك ببشاشة وجهٍ.", "fr": "Ne méprisez aucun bienfait, fût-ce rencontrer votre frère avec un visage souriant.", "en": "Do not belittle any good deed, even meeting your brother with a cheerful face."}}, {"t": "«اتَّقُوا النَّارَ وَلَوْ بِشِقِّ تَمْرَةٍ، فَمَنْ لَمْ يَجِدْ فَبِكَلِمَةٍ طَيِّبَةٍ»", "s": "رواه البخاري (كتاب الرقاق). عن عدي بن حاتم رضي الله عنه.", "k": "bukhari", "who": {"fr": "ʿAdi ibn Hatim", "en": "ʿAdi ibn Hatim"}, "m": {"ar": "من لم يجد ما يتصدّق به فليتصدّق بكلمةٍ طيّبة.", "fr": "Celui qui n’a rien à donner qu’il donne une bonne parole.", "en": "Whoever has nothing to give, let him give a kind word."}}, {"t": "«مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ»", "s": "رواه مسلم (كتاب الإيمان). عن أبي هريرة رضي الله عنه.", "k": "muslim", "who": {"fr": "Abu Hurayra", "en": "Abu Hurayrah"}, "m": {"ar": "من آمن بالله واليوم الآخر قال خيرًا أو سكت.", "fr": "Celui qui croit en Allah et au Jour dernier, qu’il dise du bien ou qu’il se taise.", "en": "Whoever believes in Allah and the Last Day, let him speak good or keep silent."}}], "steps": {"ar": ["ابتسم في وجه من تلقاه اليوم، وابدأ بالسلام.", "امدح بصدقٍ عملًا حسنًا رأيتَه من أحد.", "استبدل بالعبارة الجارحة عبارةً لطيفة.", "قبل أن تردّ على من أغضبك، اصمت لحظةً."], "fr": ["Souriez à ceux que vous croisez aujourd’hui et commencez par le salut.", "Complimentez sincèrement une bonne action que vous avez vue.", "Remplacez une phrase blessante par une phrase aimable.", "Avant de répondre à quelqu’un qui vous a irrité, taisez-vous un instant."], "en": ["Smile at everyone you meet today and start with the greeting.", "Sincerely praise a good deed you saw someone do.", "Replace a hurtful phrase with a kind one.", "Before replying to someone who angered you, stay silent for a moment."]}}, {"id": "ilm", "ic": "<path d=\"M3 5h7a3 3 0 0 1 3 3v12a2.5 2.5 0 0 0-2.5-2.5H3zM21 5h-7a3 3 0 0 0-3 3v12\"/>", "ti": {"ar": "العلم النافع والدلالة على الخير", "fr": "Le savoir utile et guider vers le bien", "en": "Beneficial knowledge and guiding to good"}, "sub": {"ar": "أجرٌ يجري بعد الموت", "fr": "Une récompense qui continue après la mort", "en": "A reward that continues after death"}, "aya": {"t": "فَتَعَٰلَى ٱللَّهُ ٱلۡمَلِكُ ٱلۡحَقُّۗ وَلَا تَعۡجَلۡ بِٱلۡقُرۡءَانِ مِن قَبۡلِ أَن يُقۡضَىٰٓ إِلَيۡكَ وَحۡيُهُۥۖ وَقُل رَّبِّ زِدۡنِي عِلۡمٗا", "s": "سورة طه، الآية 114"}, "had": [{"t": "«إِذَا مَاتَ الإِنْسَانُ انْقَطَعَ عَنْهُ عَمَلُهُ إِلاَّ مِنْ ثَلاَثَةٍ إِلاَّ مِنْ صَدَقَةٍ جَارِيَةٍ أَوْ عِلْمٍ يُنْتَفَعُ بِهِ أَوْ وَلَدٍ صَالِحٍ يَدْعُو لَهُ»", "s": "رواه مسلم (كتاب الوصية). عن أبي هريرة رضي الله عنه.", "k": "muslim", "who": {"fr": "Abu Hurayra", "en": "Abu Hurayrah"}, "m": {"ar": "تبقى للمؤمن بعد موته أبوابٌ يجري أجرُها: صدقةٌ جارية، وعلمٌ يُنتفع به، وولدٌ صالح يدعو له.", "fr": "Après sa mort, le croyant garde des portes dont la récompense continue : une aumône continue, un savoir dont on profite, un enfant pieux qui invoque pour lui.", "en": "After death the believer keeps doors whose reward continues: ongoing charity, knowledge that benefits others, a righteous child who prays for him."}}, {"t": "«مَنْ دَلَّ عَلَى خَيْرٍ فَلَهُ مِثْلُ أَجْرِ فَاعِلِهِ»", "s": "رواه مسلم (كتاب الإمارة). عن أبي مسعود الأنصاري رضي الله عنه.", "k": "muslim", "who": {"fr": "Abu Mas‘ud al-Ansari", "en": "Abu Mas‘ud al-Ansari"}, "m": {"ar": "من دلّ غيره على خيرٍ نال مثلَ أجر من عمل به.", "fr": "Celui qui guide quelqu’un vers un bien obtient une récompense semblable à celle de celui qui l’accomplit.", "en": "Whoever guides someone to something good earns a reward like that of the one who does it."}}, {"t": "«وَمَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ»", "s": "رواه مسلم (كتاب الذكر والدعاء والتوبة والاستغفار). عن أبي هريرة رضي الله عنه.", "k": "muslim", "who": {"fr": "Abu Hurayra", "en": "Abu Hurayrah"}, "m": {"ar": "طلبُ العلم طريقٌ يسّره الله لصاحبه إلى الجنة.", "fr": "La quête du savoir est un chemin qu’Allah facilite vers le Paradis.", "en": "Seeking knowledge is a path Allah makes easy toward Paradise."}}], "steps": {"ar": ["تعلّم اليوم مسألةً أو سنّةً جديدة وعلِّمها غيرك.", "شارك رابطًا نافعًا أو محاضرةً مفيدة بنيّة الخير.", "ادلل شخصًا على طريقٍ إلى الخير: جمعيّةٌ موثوقة، درسٌ، مصلّى.", "ساهم في صدقةٍ جارية: سقيا ماء، أو طباعة مصحف، أو دعم طالب علم."], "fr": ["Apprenez aujourd’hui une règle ou une sunna nouvelle et transmettez-la.", "Partagez un lien ou un cours utile dans une bonne intention.", "Orientez quelqu’un vers un bien : une association fiable, un cours, une mosquée.", "Contribuez à une aumône continue : point d’eau, impression de Corans, soutien à un étudiant."], "en": ["Learn a new ruling or sunnah today and teach it to someone.", "Share a useful link or lecture with good intention.", "Guide someone to a good: a trustworthy charity, a class, a mosque.", "Contribute to ongoing charity: a water source, printing Qurans, supporting a student."]}}, {"id": "taam", "ic": "<path d=\"M7 3v8a2 2 0 0 0 2 2v8M7 3v6M11 3v6M16 3c-2 2-2 6 0 8v10\"/>", "ti": {"ar": "إطعام الطعام وإفشاء السلام", "fr": "Nourrir et répandre le salut", "en": "Feeding people and spreading the greeting"}, "sub": {"ar": "من خير خصال الإسلام", "fr": "Parmi les meilleures qualités de l’islam", "en": "Among the best qualities of Islam"}, "aya": {"t": "وَيُطۡعِمُونَ ٱلطَّعَامَ عَلَىٰ حُبِّهِۦ مِسۡكِينٗا وَيَتِيمٗا وَأَسِيرًا إِنَّمَا نُطۡعِمُكُمۡ لِوَجۡهِ ٱللَّهِ لَا نُرِيدُ مِنكُمۡ جَزَآءٗ وَلَا شُكُورًا", "s": "سورة الإنسان، الآيات ⁦8–9⁩"}, "had": [{"t": "«أَنَّ رَجُلاً، سَأَلَ رَسُولَ اللَّهِ ﷺ أَىُّ الإِسْلاَمِ خَيْرٌ قَالَ تُطْعِمُ الطَّعَامَ وَتَقْرَأُ السَّلاَمَ عَلَى مَنْ عَرَفْتَ وَمَنْ لَمْ تَعْرِفْ»", "s": "رواه مسلم (كتاب الإيمان). عن عبد الله بن عمرو رضي الله عنهما.", "k": "muslim", "who": {"fr": "Ibn ‘Amr", "en": "Ibn ‘Amr"}, "m": {"ar": "من أفضل خصال الإسلام: إطعامُ الطعام، والسلامُ على من عرفتَ ومن لم تعرف.", "fr": "Parmi les meilleures qualités de l’islam : nourrir, et saluer ceux que l’on connaît et ceux que l’on ne connaît pas.", "en": "Among the best qualities of Islam: feeding others, and greeting those you know and those you do not."}}, {"t": "«لاَ تَدْخُلُونَ الْجَنَّةَ حَتَّى تُؤْمِنُوا وَلاَ تُؤْمِنُوا حَتَّى تَحَابُّوا. أَوَلاَ أَدُلُّكُمْ عَلَى شَىْءٍ إِذَا فَعَلْتُمُوهُ تَحَابَبْتُمْ أَفْشُوا السَّلاَمَ بَيْنَكُمْ»", "s": "رواه مسلم (كتاب الإيمان). عن أبي هريرة رضي الله عنه.", "k": "muslim", "who": {"fr": "Abu Hurayra", "en": "Abu Hurayrah"}, "m": {"ar": "إفشاءُ السلام سببٌ لتحابّ الناس، والمحبّةُ بين المؤمنين من الإيمان.", "fr": "Répandre le salut est une cause d’amour entre les gens, et l’amour entre croyants fait partie de la foi.", "en": "Spreading the greeting is a cause of love between people, and var $ = function(s){ return document.querySelector(s); };
var KEY = 'az_khayr';
function sget(k, d){ try{ var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }
function sset(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function dayKey(d){ d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

/* قراءةٌ فقط من إعدادات التطبيق: الخلفيّةُ واللغة */
var S = sget('az_settings', {}) || {};
var bg = (S.bg === 'white' || S.bg === 'dark') ? S.bg : 'sepia';
document.documentElement.setAttribute('data-bg', bg);
var lang = sget('az_khayr_lang', null) || S.lang || 'ar';
if (!DATA.ui[lang]) lang = 'ar';
var openId = null;

function prog(){ var p = sget(KEY, {}); return (p && typeof p === 'object') ? p : {}; }
function isDone(P, id, k){ return !!(P[id] && P[id][k]); }
function monthCount(P, id){ var m = dayKey().slice(0,7), n = 0; Object.keys(P[id] || {}).forEach(function(k){ if (k.slice(0,7) === m) n++; }); return n; }
function toggle(id){
  var P = prog(), k = dayKey(); P[id] = P[id] || {};
  if (P[id][k]) delete P[id][k]; else P[id][k] = 1;
  var ks = Object.keys(P[id]).sort(); while (ks.length > 400) delete P[id][ks.shift()];
  sset(KEY, P); render();
}

function sourceLine(h, L){
  if (lang === 'ar') return h.s;
  return L.by[h.k] + ' · ' + L.narrator + ': ' + h.who[lang];
}

function render(){
  var L = DATA.ui[lang], P = prog(), k = dayKey();
  document.documentElement.lang = lang; document.documentElement.dir = L.dir;
  document.title = L.title + ' — صلاتي';
  $('#h1').textContent = L.title; $('#sub').textContent = L.sub; $('#back-t').textContent = L.back; $('#foot').textContent = L.foot; $('#qr-t').textContent = L.qrT;
  document.querySelectorAll('.langs button').forEach(function(b){ b.classList.toggle('on', b.dataset.l === lang); });
  var n = DATA.doors.filter(function(d){ return isDone(P, d.id, k); }).length;
  var h = '<div class="prog"><div class="big">' + n + ' <small>' + L.of + ' ' + DATA.doors.length + '</small></div><div class="tx"><b>' + esc(L.today) + '</b>' + esc(L.doorsDone) + '</div><div class="dots" aria-hidden="true">' +
    DATA.doors.map(function(d){ return '<i class="' + (isDone(P, d.id, k) ? 'on' : '') + '"></i>'; }).join('') + '</div></div>';
  DATA.doors.forEach(function(d){
    var done = isDone(P, d.id, k), open = openId === d.id;
    h += '<article class="door' + (done ? ' done' : '') + (open ? ' open' : '') + '" id="d-' + d.id + '"><button type="button" data-id="' + d.id + '" aria-expanded="' + open + '">' +
      '<span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">' + d.ic + '</svg></span><span class="hd"><b>' + esc(d.ti[lang]) + '</b><span>' + esc(d.sub[lang]) + '</span></span>' +
      '<span class="tk" aria-hidden="true">' + (done ? '✓' : '') + '</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="' + (L.dir === 'rtl' ? 'M15 6l-6 6 6 6' : 'M9 6l6 6-6 6') + '"/></svg></button>';
    if (open){
      h += '<div class="body"><div class="sec">' + esc(L.verses) + '</div><div class="ex"><p class="q">' + esc(d.aya.t) + '</p><span class="ref">' + esc(d.aya.s) + '</span></div>' +
        '<div class="sec">' + esc(L.hadith) + '</div>' +
        d.had.map(function(x){ return '<div class="h"><p class="ht">' + esc(x.t) + '</p><p class="hs">' + esc(sourceLine(x, L)) + '</p><p class="hm"><b>' + esc(L.meaning) + ':</b> ' + esc(x.m[lang]) + '</p></div>'; }).join('') +
        '<div class="sec">' + esc(L.steps) + '</div><ul class="stp">' + d.steps[lang].map(function(s){ return '<li>' + esc(s) + '</li>'; }).join('') + '</ul><p class="note">' + esc(L.stepsNote) + '</p>' +
        '<div class="act"><button type="button" class="' + (done ? 'undo' : '') + '" data-do="' + d.id + '">' + esc(done ? L.undo : L.did) + '</button><span>' + monthCount(P, d.id) + ' ' + esc(L.month) + '</span></div></div>';
    }
    h += '</article>';
  });
  $('#main').innerHTML = h;
  $('#main').querySelectorAll('.door>button').forEach(function(b){ b.onclick = function(){ openId = (openId === b.dataset.id) ? null : b.dataset.id; render(); if (openId){ var el = $('#d-' + openId); if (el && el.scrollIntoView) el.scrollIntoView({block:'nearest'}); } }; });
  $('#main').querySelectorAll('[data-do]').forEach(function(b){ b.onclick = function(){ toggle(b.dataset['do']); }; });
}
document.querySelectorAll('.langs button').forEach(function(b){ b.onclick = function(){ lang = b.dataset.l; sset('az_khayr_lang', lang); render(); }; });
render();
})();
</script>
